server {
    listen 80;
    server_name gitpup.fun;
    root /opt/gitpup/web_dist;
    index index.html story.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /story {
        try_files /story.html =404;
    }

    location /preview/ {
        add_header Cache-Control "no-store";
        proxy_pass http://127.0.0.1:5173/preview/;
        proxy_http_version 1.1;
        proxy_connect_timeout 20s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        send_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        proxy_pass http://127.0.0.1:5173/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 20s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        send_timeout 240s;
        proxy_set_header Host $host;
    }

    location /auth/ {
        add_header Cache-Control "no-cache";
        proxy_pass http://127.0.0.1:5173/auth/;
        proxy_http_version 1.1;
        proxy_connect_timeout 20s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        send_timeout 240s;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl http2;
    server_name gitpup.fun;
    ssl_certificate /etc/letsencrypt/live/gitpup.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitpup.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    root /opt/gitpup/web_dist;
    index index.html story.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /story {
        try_files /story.html =404;
    }

    location /preview/ {
        add_header Cache-Control "no-store";
        proxy_pass http://127.0.0.1:5173/preview/;
        proxy_http_version 1.1;
        proxy_connect_timeout 20s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        send_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        add_header Cache-Control "no-cache";
        proxy_pass http://127.0.0.1:5173/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 20s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        send_timeout 240s;
        proxy_set_header Host $host;
    }

    location /auth/ {
        add_header Cache-Control "no-cache";
        proxy_pass http://127.0.0.1:5173/auth/;
        proxy_http_version 1.1;
        proxy_connect_timeout 20s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        send_timeout 240s;
        proxy_set_header Host $host;
    }
    location /x-auth {
        proxy_pass http://127.0.0.1:5174/x-auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /x-auth/ {
        proxy_pass http://127.0.0.1:5174/x-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /x-oauth/ {
        proxy_pass http://127.0.0.1:5174/x-oauth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
