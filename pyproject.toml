[project]
name = "gitpup-agent"
version = "0.1.0"
description = "Golden Retriever AI Agent for gitlawb"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TomKet", email = "tomket@gitlawb" }]
keywords = ["gitlawb", "ai-agent", "decentralized", "golden-retriever"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "gitlawb>=0.1",
    "openai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "tree-sitter>=0.22",
    "jsonschema>=4.0",
]

[project.scripts]
gitpup = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
