function formatDate(ts){
  if(!ts)return'';
  if(isNaN(new Date(ts).getTime()))return ts.toString().substring(0,16);
  var d=new Date(ts);
  var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dd=d.getDate().toString().padStart(2,'0');
  var mm=M[d.getMonth()];
  var yy=d.getFullYear();
  var HH=d.getHours().toString().padStart(2,'0');
  var MM=d.getMinutes().toString().padStart(2,'0');
  return dd+' '+mm+' '+yy+' '+HH+':'+MM;
}

  function viewActivity(){JR.style.display='';JR.innerHTML='<p style="padding:14px;color:#555;font-size:11px">Loading...</p>';loadActivity()}
  
  // Story Card Logic
  var MOOD_COLORS = {'explorer':'#5cb88a','scholar':'#d4a24c','builder':'#5eadb8','contributor':'#8b82b8','architect':'#c9a24c','dreamer':'#c95c5c'};
  setInterval(function(){
    var scDay = document.getElementById('sc-day');
    var scMood = document.getElementById('sc-mood');
    var scDot = document.getElementById('sc-mood-dot');
    var scCost = document.getElementById('sc-cost');

    // Fetch mood from personality
    fetch('/api/personality').then(function(r){return r.json()}).then(function(d) {
      var vals = d.data || [];
      var maxVal = 0, maxIdx = 0;
      for(var i=0;i<vals.length;i++){ if(vals[i]>maxVal){maxVal=vals[i];maxIdx=i;} }
      var keys = d.keys || [];
      var dominant = keys[maxIdx] || 'dreamer';
      var labels = d.labels || [];
      var moodLabel = labels[maxIdx] || 'Dreamer';
      if(scMood) scMood.textContent = moodLabel;
      if(scDot) scDot.style.background = MOOD_COLORS[dominant] || '#888';
    });

    // Fetch day from /api/status (computed dynamically)
    fetch('/api/status').then(function(r){return r.json()}).then(function(d) {
      if(scDay) scDay.textContent = d.day || 1;
    });

    // Fetch real LLM cost from /api/cost
    fetch('/api/cost').then(function(r){return r.json()}).then(function(d) {
      if(scCost) {
        var total = (d && d.total_cost_usd) || 0;
        if(total >= 1000) scCost.textContent = '$' + total.toFixed(1);
        else scCost.textContent = '$' + total.toFixed(2);
      }
    }).catch(function(){
      if(scCost) scCost.textContent = '/A';
    });
  }, 8000);

  function loadJournal(){
    fetch('/api/journal').then(function(r){return r.json()}).then(function(d){
      if(d.entries&&d.entries.length>0){
        JR.innerHTML=d.entries.slice(0,50).map(function(e){
          return '<div class="ji"><div class="ji-t"><span class="ji-t">'+formatDate(e.ts)+'</span></div><div class="ji-p">'+((e.body&&e.body.length>0)?e.body:(e.x||''))+'</div></div>';
        }).join('');
      }else{JR.innerHTML='<p style="padding:14px;color:#444;font-size:11px">No journal entries yet — Goldie is still sleeping </p>'}
    }).catch(function(){JR.innerHTML='<p style="padding:14px;color:#444;font-size:11px">Failed to load journal</p>'});
  }
  function loadStatus(){
    fetch('/api/status').then(function(r){return r.json()}).then(function(d){
      var s={'puppy':'🐶 Puppy','learner':'🐕 Learner','coder':'💻 Coder','builder':'️ Builder','architect':'️ Architect','master':'👑 Master'};
      var stageEl=document.getElementById('stg');if(stageEl)stageEl.textContent=s[d.stage]||d.stage;
      var sEl=document.getElementById('vst');if(sEl)sEl.textContent=s[d.stage]||d.stage;
      var el2=document.getElementById('vsc');if(el2)el2.textContent=''+(d.score||0);
      var el3=document.getElementById('vru');if(el3)el3.textContent=''+(d.runs||0);
      var el4=document.getElementById('vsta');if(el4)el4.textContent=d.state||'idle';
      var el5=document.getElementById('vday');if(el5)el5.textContent=''+(d.day||1);
      var el6=document.getElementById('vlr');
      if(el6){
          if(d.last_run && d.last_run > 0){
              var dt=new Date(d.last_run*1000);
              el6.textContent=formatDate(dt.toISOString().slice(0,19).replace('T',' '));
          }else{
              el6.textContent='never';
          }
      }
      var el7=document.getElementById('sts');if(el7)el7.textContent=d.score?d.score.toFixed(2):'0.05';
    }).catch(function(){});
  }
  function loadActivity(){
    fetch('/api/activity').then(function(r){return r.json()}).then(function(d){
      if(d.entries&&d.entries.length>0){
        JR.innerHTML='<p style="padding:8px 14px;font-size:11px;color:#666;font-weight:600">Recent Activity</p>'+d.entries.slice(0,20).map(function(e){var desc='';if(e.body&&e.body.length>50)desc=e.body.substring(0,80)+'...';return '<div class="ai3"><span class="ac3">'+(e.i||'✨')+'</span><span class="at3" style="font-size:11px;line-height:1.4"><div style="font-weight:600;color:#ddd">'+(e.x||'')+'</div><div style="font-size:10px;color:#777;margin-top:2px">'+desc+'</div></span><span class="am3">'+formatDate(e.ts)+'</span></div>'}).join('');
      }else{JR.innerHTML='<p style="padding:14px;color:#444;font-size:11px">No recent activity</p>'}
    }).catch(function(){});
  }
  function sendChat(){
    var m=CI2.value.trim();if(!m)return;
    var b=document.createElement('div');b.className='bb bu';b.textContent=m;CB.appendChild(b);CB.scrollTop=CB.scrollHeight;
    CI2.value='';
    var body={message:m};if(ghToken)body.token=ghToken;
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){
      var bb=document.createElement('div');bb.className='bb bo';bb.textContent=d.reply||'...';CB.appendChild(bb);CB.scrollTop=CB.scrollHeight;
    }).catch(function(e){var bb=document.createElement('div');bb.className='bb bo';bb.textContent='Error';CB.appendChild(bb);CB.scrollTop=CB.scrollHeight});
  }
  CS2.onclick=sendChat;
  CI2.onkeydown=function(e){if(e.key==='Enter')sendChat()};
  CC.onclick=function(){CP.classList.remove('open');showView('jr')};
  function openChat(){
    if(!ghToken){LG.classList.add('show');JR.style.display='none';return}
    LG.classList.remove('show');JR.style.display='none';CP.classList.add('open');
    setTimeout(function(){CI2&&CI2.focus()},200);
  }
  $$('.nb').forEach(function(b){
    b.onclick=function(e){
      var a=b.dataset.a;if(!a)return;
      if(a==='chat'){openChat();return}
      CP.classList.remove('open');LG.classList.remove('show');
      if(a==='jr')viewJournal();else if(a==='activity')viewActivity();else if(a==='stats')viewStats();
    };
  });
  /* Goldie position + walk system */
  var GC=document.getElementById('gc');
  var pos=[
    {left:'90px',label:'home',state:'sleeping',emoji:'😴',cls:'facing-left'},
    {left:'50%',tx:'translate(-50%)',label:'center',state:'idle',emoji:'🐾',cls:''},
    {left:'calc(100% - 160px)',label:'slide',state:'thinking',emoji:'💡',cls:'facing-left'}
  ];
  var pi=1; // start at center
  function walkTo(idx){
    var p=pos[idx];
    GS.className='walking'+(p.cls?' '+p.cls:'');
    GC.style.left=p.left;
    GC.style.bottom='24px';
    GC.style.transform=p.tx?p.tx:'none';
    GS.className=p.state+(p.cls?' '+p.cls:'');
    AIND.textContent=p.emoji;
  }
  setInterval(function(){
    pi=(pi+1)%pos.length;
    walkTo(pi);
  },8000);
  LD.classList.add('hide');setTimeout(function(){LD.style.display='none'},400);
  loadJournal();loadStatus();
})();
</script>
</body>
</html>
