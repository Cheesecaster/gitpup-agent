<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GitPup — Golden Retriever AI Agent</title>
<meta name="theme-color" content="#050a1a">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050a1a;font-family:'Segoe UI',system-ui,sans-serif;color:#ddd}
body{display:flex;flex-direction:column}
#pg{position:relative;width:100%;max-width:600px;height:300px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#030814 0%,#081030 20%,#0d2040 38%,#153525 58%,#1e5535 74%,#287045 88%,#308550 100%);flex-shrink:0}
#ct{width:100%;max-width:600px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;position:relative;background:rgba(8,12,28,.35);border-top:1px solid rgba(255,255,255,.03)}
#nb{width:100%;max-width:600px;margin:0 auto;height:72px;background:rgba(6,10,24,.98);border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0;padding:0 6px}
.st{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.5;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
.moon{position:absolute;top:20px;right:20px;width:40px;height:40px;background:radial-gradient(circle at 30% 30%,#fff,#fef3c7,#d4a017);border-radius:50%;box-shadow:0 0 40px rgba(253,203,110,.3)}

.cld{position:absolute;background:rgba(255,255,255,.06);border-radius:50px;animation:float 35s linear infinite}
.cld::before{content:'';position:absolute;background:inherit;border-radius:50%}
.c1{width:60px;height:16px;top:30px;left:-60px;opacity:.8}
.c1::before{width:24px;height:24px;top:-12px;left:10px}
.c2{width:40px;height:12px;top:50px;left:-40px;opacity:.5;animation-delay:-15s;animation-duration:45s}
.c2::before{width:16px;height:16px;top:-8px;left:5px}
@keyframes float{0%{transform:translateX(0)}100%{transform:translateX(750px)}}

@keyframes df{0%{transform:translateX(0)}100%{transform:translateX(660px)}}

.grb{position:absolute;bottom:0;width:100%;height:40px;background:linear-gradient(0deg,#1e5535,#287045 40%,#308550)}

/* Doghouse */
.dh{position:absolute;bottom:32px;left:16px;width:40px;height:36px;background:#c0392b;border-radius:4px;z-index:1}
.dh::before{content:'';position:absolute;top:-14px;left:-6px;width:52px;height:16px;background:#8b2010;border-radius:8px 8px 0 0}
.dh::after{content:'';position:absolute;bottom:0;left:10px;width:20px;height:20px;background:#2a1510;border-radius:4px 4px 0 0}
.dh span{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:6px;color:#fff;opacity:.5}

/* Slide */
.sl{position:absolute;bottom:32px;right:16px;width:46px;height:32px;z-index:1}
.sl-pole{position:absolute;top:0;left:2px;width:3px;height:32px;background:#555;border-radius:2px}
.sl-platform{position:absolute;top:0;right:0;width:14px;height:32px;background:#f39c12;border-radius:0 0 4px 0}
.sl-board{position:absolute;top:6px;left:2px;width:34px;height:3px;background:#eee;border-radius:2px;transform:rotate(20deg);transform-origin:left bottom}
.sl-tube{position:absolute;top:9px;left:0;width:32px;height:20px;background:linear-gradient(90deg,#fff,#e0e0e0,#d0d0d0);border-radius:20px;transform:rotate(20deg);transform-origin:left bottom;border:1px solid #ccc;background:rgba(255,255,255,.25)}

#tb{position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:6px;align-items:center}
.sb1{background:rgba(8,12,24,.7);border:1px solid rgba(212,160,23,.2);border-radius:14px;padding:3px 10px;font-size:9px;color:#d4a017;white-space:nowrap}
.sb2{background:rgba(8,12,24,.7);border:1px solid rgba(100,255,218,.12);border-radius:12px;padding:3px 8px;font-size:8px;color:#64ffda;white-space:nowrap}
.gt2{position:absolute;bottom:22px;width:0;height:0;border-left:2.5px solid transparent;border-right:2.5px solid transparent;border-bottom:8px solid #2a6a40}
#gc{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none}
#gs{animation:gb2 1.4s ease-in-out infinite}
@keyframes gb2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.dog{position:relative;width:64px;height:60px}
.d-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:36px;background:linear-gradient(155deg,#ecc42c,#d8a818,#c49410,#aa8208);border-radius:48% 48% 34% 34%;box-shadow:inset -4px -3px 10px rgba(120,80,0,.28),inset 2px 2px 6px rgba(255,230,140,.12),0 3px 10px rgba(0,0,0,.22);z-index:1}
.d-head{position:absolute;top:0;left:8px;width:48px;height:40px;background:linear-gradient(150deg,#ecc42c,#d8a818,#c49410);border-radius:50% 48% 50% 52%;z-index:3}
.d-ear{position:absolute;z-index:4}
.d-ear.l{top:-7px;left:-3px;width:14px;height:18px;background:linear-gradient(155deg,#c89410,#a87808);border-radius:44% 44% 48% 48%;transform:rotate(-7deg);animation:ew 2.5s ease-in-out infinite}
.d-ear.r{top:-5px;right:-3px;width:14px;height:16px;background:linear-gradient(155deg,#d8a818,#c89410);border-radius:44% 48% 48% 48%;transform:rotate(7deg);animation:ewr 2.5s ease-in-out infinite .35s}
@keyframes ew{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-3deg)}}
@keyframes ewr{0%,100%{transform:rotate(7deg)}50%{transform:rotate(3deg)}}
.d-eye{position:absolute;width:11px;height:13px;background:radial-gradient(circle at 38% 33%,#281835,#180a28 55%);border-radius:50%;top:8px;z-index:2}
.d-eye.l{left:4px}.d-eye.r{left:26px}
.d-eye::before{content:'';position:absolute;top:1px;left:2px;width:6px;height:6px;background:radial-gradient(circle,#fff 55%,rgba(255,255,255,.75));border-radius:50%}
.d-eye::after{content:'';position:absolute;bottom:1px;right:2px;width:2.5px;height:2.5px;background:rgba(255,255,255,.65);border-radius:50%}
#gs:not(.sleeping) .d-eye{animation:bk 5s ease-in-out infinite}
@keyframes bk{0%,42%,44%,100%{transform:scaleY(1)}43%{transform:scaleY(.06)}}
.d-nose{position:absolute;bottom:8px;right:2px;width:8px;height:5.5px;background:radial-gradient(ellipse at 35% 28%,#3a2850,#1a0a28);border-radius:50%;z-index:5}
.d-mouth{position:absolute;bottom:3px;right:4px;width:8px;height:3.5px;border-bottom:1.8px solid rgba(110,70,15,.5);border-radius:0 0 50% 50%;z-index:5}
.d-mouth::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:4.5px;height:5px;background:linear-gradient(180deg,#ff7590,#e85565);border-radius:0 0 50% 50%;animation:tg .9s ease-in-out infinite alternate}
@keyframes tg{0%{transform:translateX(-50%) scaleY(1)}100%{transform:translateX(-50%) scaleY(1.15)}}
.d-leg{position:absolute;bottom:-7px;width:9px;height:10px;background:linear-gradient(180deg,#d8a818,#c49410);border-radius:3px 3px 50% 50%;z-index:0}
.d-leg::after{content:'';position:absolute;bottom:0;left:-1px;width:11px;height:4px;background:#b08008;border-radius:50%}
.d-leg.fl{left:8px}.d-leg.fr{left:20px}.d-leg.bl{right:12px}.d-leg.br{right:3px}
.d-tail{position:absolute;top:-6px;right:1px;width:16px;height:9px;background:linear-gradient(90deg,#d8a818,#c49410);border-radius:32px 36%;transform-origin:left center;animation:tailw .5s ease-in-out infinite alternate;z-index:0}
@keyframes tailw{0%{transform:rotate(-20deg)}100%{transform:rotate(12deg)}}
#gs.sleeping .d-eye{border-radius:0 0 50% 50%;width:11px;height:5px;top:10px;animation:none!important;border-bottom:2.2px solid #281835}
#gs.sleeping .d-eye::before,#gs.sleeping .d-eye::after,#gs.sleeping .d-mouth::after{display:none}
#aind{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:14px;pointer-events:none;animation:fl 2s ease-in-out infinite;opacity:.75}
@keyframes fl{0%,100%{transform:translateX(-50%) translateY(0);opacity:.5}50%{transform:translateX(-50%) translateY(-5px);opacity:1}}
#jr{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ji{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.035)}
.ji-t{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.ji-i{font-size:15px;flex-shrink:0}
.ji-t span{font-size:10px;color:#555}
.ji-x{font-size:12px;color:#d0d0d0;line-height:1.35;margin-bottom:3px}
.ji-b{font-size:11px;color:#999;line-height:1.5;border-left:2px solid rgba(212,160,23,.15);padding-left:8px;margin-top:3px;white-space:pre-wrap}
.sr3{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.035)}
.sr3 span:first-child{font-size:11px;color:#666}.sr3 span:last-child{font-size:11px;color:#ddd;font-weight:600}
.ai3{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.035);display:flex;align-items:center;gap:8px}
.ai3 .ac3{font-size:15px;flex-shrink:0}
.ai3 .at3{flex:1;font-size:11px;color:#aaa;line-height:1.3}
.ai3 .am3{font-size:9px;color:#444;flex-shrink:0}
#cp2{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;background:rgba(8,12,28,.97);z-index:60;height:0;overflow:hidden;transition:height .3s}
#cp2.open{height:68%}
.cp2-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.cp2-h h3{font-size:11px;font-weight:600;color:#fff}
.cp2-x{background:none;border:none;color:#555;font-size:13px;cursor:pointer;padding:2px 5px}
#cb2{flex:1;min-height:0;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.bb{max-width:85%;padding:7px 11px;border-radius:11px;font-size:11px;line-height:1.5}
.bb.bo{background:rgba(212,160,23,.07);border:1px solid rgba(212,160,23,.1);align-self:flex-start;border-bottom-left-radius:2px;color:#ccc}
.bb.bu{background:rgba(100,180,255,.07);border:1px solid rgba(100,180,255,.1);align-self:flex-end;border-bottom-right-radius:3px}
.ca2{display:flex;gap:5px;padding:7px 12px;border-top:1px solid rgba(255,255,255,.05)}
.ci2{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:7px 11px;color:#ddd;font-size:11px;outline:none}
.cs2{background:#d4a017;border:none;border-radius:50%;width:28px;height:28px;color:#050a1a;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lg{position:absolute;inset:0;background:rgba(5,10,20,.95);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lg.show{display:flex}
.lg-t{font-size:13px;color:#777;text-align:center;line-height:1.6}.lg-t b{color:#d4a017}
.lg-a{background:linear-gradient(135deg,#24292e,#1b1f23);color:#fff;border:1px solid #30363d;border-radius:8px;padding:9px 20px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px;text-decoration:none}
.lg-a:hover{border-color:#d4a017}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:none;color:#555;cursor:pointer;padding:4px 8px;border-radius:8px;transition:all .15s;min-width:52px;height:56px;text-decoration:none}
.nb .ic{font-size:22px;line-height:1;display:block}
.nb .lb{font-size:9px;margin-top:2px;display:block;font-weight:500}
.nb.act{color:#d4a017;background:rgba(212,160,23,.06)}
.nb:active{color:#fff}
.ns{width:1px;height:32px;background:rgba(255,255,255,.06);margin:0 0}
#ld{position:fixed;inset:0;background:#040810;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
#ld.hide{opacity:0;transition:opacity .4s;pointer-events:none}
.ldp{width:28px;height:28px;border:2.5px solid rgba(212,160,23,.12);border-top-color:#d4a017;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><div class="ldp"></div><p style="margin-top:8px;font-size:9px;color:#d4a017">Loading...</p></div>
<div id="pg">
  <div class="st" style="top:8px;left:16px"></div>
  <div class="st" style="top:14px;left:120px;animation-delay:.6s"></div>
  <div class="st" style="top:5px;left:230px"></div>
  <div class="st" style="top:18px;left:330px;animation-delay:.4s"></div>
  <div class="st" style="top:10px;left:430px;animation-delay:.2s"></div>
  <div class="st" style="top:24px;left:55px"></div>
  <div class="st" style="top:3px;left:290px;animation-delay:.8s"></div>
  <div class="moon"></div>
  <div class="cld c1"></div><div class="cld c2"></div>
  <div class="dh"></div>
  <div class="sl"><div class="sl-tube"></div><div class="sl-pole"></div><div class="sl-platform"></div></div>
  <div class="grb"></div>
  <div id="gc"><div id="gs" class="idle"><div id="aind">🐾</div><div class="dog">
      <div class="d-ear l"></div><div class="d-ear r"></div>
      <div class="d-body"></div>
      <div class="d-head">
        <div class="d-eye l"></div><div class="d-eye r"></div>
        <div class="d-snout"><div class="d-nose"></div><div class="d-mouth"></div></div>
      </div>
      <div class="d-leg fl"></div><div class="d-leg fr"></div><div class="d-leg bl"></div><div class="d-leg br"></div>
      <div class="d-tail"></div>
    </div></div></div>
</div><div id="ct">
  <div id="jr"></div>
  <div id="cp2">
    <div class="cp2-h"><h3>💬 Chat with Goldie</h3><button class="cp2-x" id="cc">✕</button></div>
    <div id="cb2"></div>
    <div class="ca2"><input class="ci2" id="chati" placeholder="Ask Goldie..." autocomplete="off"><button class="cs2" id="cssb">➤</button></div>
  </div>
  <div id="lg">
    <div class="lg-t">Chat requires<br><b>GitHub authentication</b></div>
    <a class="lg-a" id="lg-link"> Login with GitHub</a>
  </div>
</div>
<nav id="nb">
  <button class="nb act" data-a="jr"><span class="ic">📓</span><span class="lb">Journal</span></button>
  <button class="nb" data-a="chat"><span class="ic">💬</span><span class="lb">Chat</span></button>
  <button class="nb" data-a="activity"><span class="ic">📡</span><span class="lb">Activity</span></button>
  <button class="nb" data-a="stats"><span class="ic">📊</span><span class="lb">Stats</span></button>
  <div class="ns"></div>
  <a class="nb" href="https://gitlawb.com" target="_blank"><span class="ic"></span><span class="lb">GLawb</span></a>
  <a class="nb" href="https://github.com" target="_blank"><span class="ic">🐙</span><span class="lb">GitHub</span></a>
</nav>
<script>
function el(id){return document.getElementById(id)}
function qa(sel){return document.querySelectorAll(sel)}
(function(){
  var GH_CLIENT_ID='Ov23liLMEsHCQUzsfIKX';
  var GH_REDIRECT='https://gitpup.fun/auth/callback';
  var LD=el('ld'),GS=el('gs'),JR=el('jr'),AIND=el('aind');
  var CP=el('cp2'),CB=el('cb2'),CI2=el('chati'),CS2=el('cssb'),CC=el('cc'),LG=el('lg'),LG_LINK=el('lg-link');
  var ghToken=localStorage.getItem('gp_gh_token');
  if(!ghToken){try{var u=JSON.parse(localStorage.getItem('gp_gh_user')||'{}');ghToken=u.token||null}catch(e){}}
  LG_LINK.onclick=function(){window.location.href='https://github.com/login/oauth/authorize?client_id='+encodeURIComponent(GH_CLIENT_ID)+'&redirect_uri='+encodeURIComponent(GH_REDIRECT)+'&scope=read:user'};
  if(ghToken){CS2.disabled=false}else{CS2.disabled=true}
  function showView(id){
    qa('.nb').forEach(function(b){b.classList.remove('act')});
    qa('.nb').forEach(function(b){if(b.dataset.a===id)b.classList.add('act')});
    CP.classList.remove('open');LG.classList.remove('show');
    if(id==='jr'){JR.style.display='';JR.innerHTML='<p style="padding:14px;color:#555;font-size:11px">Loading journal...</p>';loadJournal();}
    else{JR.style.display='';}
  }
  function viewJournal(){JR.style.display='';JR.innerHTML='<p style="padding:14px;color:#555;font-size:11px">Loading journal...</p>';loadJournal()}
  function viewStats(){
    CP.classList.remove('open');LG.classList.remove('show');JR.style.display='';
    JR.innerHTML='<div class="sr3"><span>Stage</span><span id="vst">Loading...</span></div><div class="sr3"><span>Score</span><span id="vsc">...</span></div><div class="sr3"><span>Runs</span><span id="vru">...</span></div><div class="sr3"><span>State</span><span id="vsta">...</span></div><div class="sr3"><span>LLM</span><span id="vllm">qwen/qwen3.6-flash</span></div><div class="sr3"><span>Day</span><span id="vday">...</span></div><div class="sr3"><span>Last Run</span><span id="vlr">...</span></div>';
    loadStatus();
  }
  function viewActivity(){CP.classList.remove('open');LG.classList.remove('show');JR.style.display='';JR.innerHTML='<p style="padding:14px;color:#555;font-size:11px">Loading...</p>';loadActivity()}
  function loadJournal(){
    fetch('/api/journal').then(function(r){return r.json()}).then(function(d){
      var entries=d.entries||[];
      if(entries.length>0){
        JR.innerHTML=entries.map(function(e){
          var isNarrative=e.type==='narrative';
          var moodColor=e.mood_color||'#5a6080';
          var moodLabel=e.mood_label||'';
          var moodBadge=isNarrative?'<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:600;color:'+moodColor+';background:'+moodColor+'15;border:1px solid '+moodColor+'40;margin-left:8px">'+moodLabel+'</span>':'';
          var titleStyle=isNarrative?'font-weight:700;color:#e8e8f0':'';
          var cardStyle=isNarrative?'display:block;border-radius:10px;padding:14px;margin:6px 0;background:rgba(15,18,35,.6);border-left:3px solid '+moodColor+'40;':'';
          var html='';
          if(isNarrative){
            html='<div style="'+cardStyle+'">'+'<div style="font-size:10px;color:#555;margin-bottom:4px">'+(e.t||'')+' · Day '+(e.day||'?')+'</div>'+'<div class="ji-t">'+'<span class="ji-i">'+(e.i||'\U0001f9d0')+'</span>'+'<span class="ji-x" style="'+titleStyle+'">'+formatNarrative((e.x||'').substring(0,60))+'</span>'+moodBadge+'</div>'+'<div style="font-size:12px;color:#b0b0c0;line-height:1.7;margin-top:8px">'+formatNarrative(e.body||'')+'</div>'+'</div>';
          }else{
            html='<div class="ji">'+'<div class="ji-t">'+'<span class="ji-i">'+(e.i||'\u2728')+'</span>'+'<span>'+(e.t||'')+'</span>'+'</div>'+'<div class="ji-x">'+(e.x||'')+'</div>';
            if(e.body&&e.body.length>0){html+='<div class="ji-b">'+e.body+'</div>'}
            html+='</div>';
          }
          return html;
        }).join('');
      }else{JR.innerHTML='<p style="padding:14px;color:#444;font-size:11px">Goldie is still learning...</p>'}
    }).catch(function(){JR.innerHTML='<p style="padding:14px;color:#444;font-size:11px">Failed</p>'});
  }
  function formatNarrative(text){
    if(!text)return '';
    text=text.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    text=text.replace(/\*(.+?)\*/g,'<i>$1</i>');
    text=text.replace(/`([^`]+)`/g,'<code style="background:rgba(212,160,23,.12);color:#d4a017;padding:1px 6px;border-radius:4px">$1</code>');
    text=text.replace(/\n/g,'<br>');
    return text;
  }
  function loadActivity(){
    fetch('/api/journal').then(function(r){return r.json()}).then(function(d){
      if(d.entries&&d.entries.length>0){
        JR.innerHTML='<p style="padding:8px 14px;font-size:11px;color:#666;font-weight:600">Recent Activity</p>'+d.entries.slice().reverse().slice(0,20).map(function(e){var desc='';if(e.body&&e.body.length>50)desc=e.body.substring(0,80)+'...';return '<div class="ai3"><span class="ac3">'+(e.i||'✨')+'</span><span class="at3" style="font-size:11px;line-height:1.4"><div style="font-weight:600;color:#ddd">'+(e.x||'')+'</div><div style="font-size:10px;color:#777;margin-top:2px">'+desc+'</div></span><span class="am3">'+(e.t||'')+'</span></div>'}).join('');
      }
    }).catch(function(){});
  }
  function sendChat(){
    var m=CI2.value.trim();if(!m)return;
    var b=document.createElement('div');b.className='bb bu';b.textContent=m;CB.appendChild(b);CB.scrollTop=CB.scrollHeight;
    CI2.value='';
    var body={message:m};if(ghToken)body.token=ghToken;
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){
      var bb=document.createElement('div');bb.className='bb bo';bb.textContent=d.reply||'...';CB.appendChild(bb);CB.scrollTop=CB.scrollHeight;
    }).catch(function(e){var bb=document.createElement('div');bb.className='bb bo';bb.textContent='Error';CB.appendChild(bb);CB.scrollTop=CB.scrollHeight});
  }
  CS2.onclick=sendChat;
  CI2.onkeydown=function(e){if(e.key==='Enter')sendChat()};
  CC.onclick=function(){CP.classList.remove('open');showView('jr')};
  function openChat(){
    if(!ghToken){LG.classList.add('show');JR.style.display='none';return}
    LG.classList.remove('show');JR.style.display='none';CP.classList.add('open');
    setTimeout(function(){CI2&&CI2.focus()},200);
  }
  qa('.nb').forEach(function(b){
    b.onclick=function(e){
      var a=b.dataset.a;if(!a)return;
      if(a==='chat'){openChat();return}
      CP.classList.remove('open');LG.classList.remove('show');
      if(a==='jr')viewJournal();else if(a==='activity')viewActivity();else if(a==='stats')viewStats();
    };
  });
  var ss=['idle','learning','coding','thinking','running'],si=0;
  setInterval(function(){si=(si+1)%ss.length;var c=ss[si];GS.className=c;AIND.textContent={'idle':'🐾','learning':'📚','coding':'⌨️','thinking':'💡','running':'🏃'}[c]||''},7000);
  LD.classList.add('hide');setTimeout(function(){LD.style.display='none'},400);
  loadJournal();loadStatus();
})();
</script>
</body>
</html>
