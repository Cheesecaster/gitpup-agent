<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GitPup — Golden Retriever AI Agent</title>
<meta name="theme-color" content="#050a1a">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050a1a;font-family:'Segoe UI',system-ui,sans-serif;color:#ddd}

/* ═══ LAYOUT ═══ */
body{display:flex;flex-direction:column}
#pg{position:relative;width:100%;max-width:600px;height:300px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#030814 0%,#081030 20%,#0d2040 38%,#153525 58%,#1e5535 74%,#287045 88%,#308550 100%);flex-shrink:0}
#ct{width:100%;max-width:600px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;position:relative;background:rgba(8,12,28,.35);border-top:1px solid rgba(255,255,255,.03)}
#nb{width:100%;max-width:600px;margin:0 auto;height:64px;background:rgba(6,10,24,.98);border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;gap:2px;flex-shrink:0;padding:0 4px}

/* ═══ PLAYGROUND ELEMENTS ═══ */
.st{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.5;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
.moon{position:absolute;top:14px;right:25px;width:36px;height:36px;background:radial-gradient(circle at 36% 36%,#fef3c7,#fde68a,#d4a017);border-radius:50%;box-shadow:0 0 30px rgba(253,203,110,.25)}
.cld{position:absolute;background:rgba(255,255,255,.05);border-radius:50px;animation:df 24s linear infinite}
.cld::before,.cld::after{content:'';position:absolute;background:inherit;border-radius:50%}
.cc1{width:55px;height:14px;top:36px;left:-55px}.cc1::before{w:26px;h:26px;top:-12px;left:8px}.cc1::after{w:18px;h:18px;top:-4px;left:30px}
.cc2{w:36px;height:12px;top:56px;left:-36px;animation-delay:-12s;animation-duration:30s}.cc2::before{width:18px;height:18px;top:-9px;left:5px}.cc2::after{w:14px;height:14px;top:-3px;left:20px}
@keyframes df{0%{transform:translateX(0)}100%{transform:translateX(660px)}}
.grb{position:absolute;bottom:0;width:100%;height:48px;background:linear-gradient(0deg,#1a5035,#2a6a40 50%,#388548)}
.dh{position:absolute;bottom:22px;left:10px;z-index:5}
.dhn{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:7px;color:#fff;background:rgba(178,34,34,.85);padding:1px 4px;border-radius:6px;white-space:nowrap}
.dhr{width:60px;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid #c0392b;position:relative;left:-8px}
.dhr::after{content:'';position:absolute;top:18px;left:-10px;width:80px;height:2.5px;background:#a03020;border-radius:1px}
.dhb{width:46px;height:30px;background:linear-gradient(135deg,#8B6914,#A0782D);border:1.5px solid #6B4F10;border-radius:0 0 2px 2px;position:relative;box-shadow:inset -3px 0 10px rgba(0,0,0,.2)}
.dhd{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:14px;height:18px;background:#040810;border-radius:8px 8px 0 0;border:1.5px solid #6B4F10;border-bottom:none}
.sl{position:absolute;bottom:22px;right:10px;z-index:5}
.s1{width:26px;height:11px;background:#5a5a8a;border:1.5px solid #6a6a9a;border-radius:2px}
.s2{width:2.5px;height:36px;background:linear-gradient(0deg,#e74c3c,#f39c12);position:absolute;top:-30px;left:5px;transform:rotate(22deg);transform-origin:bottom left;border-radius:1.5px}
.s3{w:18px;height:2.5px;background:linear-gradient(90deg,#e74c3c,#f39c12);position:absolute;top:4px;left:26px;transform:rotate(10deg);transform-origin:left center;border-radius:1.5px}
#tb{position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:6px;align-items:center}
.sb1{background:rgba(8,12,24,.7);border:1px solid rgba(212,160,23,.2);border-radius:14px;padding:3px 10px;font-size:9px;color:#d4a017;white-space:nowrap}
.sb2{background:rgba(8,12,24,.7);border:1px solid rgba(100,255,218,.12);border-radius:12px;padding:3px 8px;font-size:8px;color:#64ffda;white-space:nowrap}
.gt2{position:absolute;bottom:32px;width:0;height:0;border-left:2.5px solid transparent;border-right:2.5px solid transparent;border-bottom:8px solid #2a6a40}

/* ═══ CHIBI GOLDIE ═══ */
#gc{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none}
#gs{animation:gb2 1.4s ease-in-out infinite}
@keyframes gb2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.dog{position:relative;width:64px;height:60px}
.d-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:36px;background:linear-gradient(155deg,#ecc42c,#d8a818,#c49410,#aa8208);border-radius:48% 48% 34% 34%;box-shadow:inset -4px -3px 10px rgba(120,80,0,.28),inset 2px 2px 6px rgba(255,230,140,.12),0 3px 10px rgba(0,0,0,.22);z-index:1}
.d-body::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:32px;height:14px;background:radial-gradient(ellipse,rgba(255,240,160,.38),rgba(255,230,140,.08));border-radius:50%}
.d-head{position:absolute;top:0;left:8px;width:48px;height:40px;background:linear-gradient(150deg,#ecc42c,#d8a818,#c49410);border-radius:50% 48% 50% 52%;box-shadow:inset -3px -2px 8px rgba(120,80,0,.18),inset 2px 2px 5px rgba(255,230,140,.12);z-index:3}
.d-snout{position:absolute;bottom:3px;right:-2px;width:16px;height:12px;background:linear-gradient(135deg,rgba(255,235,160,.45),rgba(255,220,130,.25));border-radius:50%;z-index:1}
.d-ear{position:absolute;z-index:4}
.d-ear.l{top:-7px;left:-3px;width:14px;height:18px;background:linear-gradient(155deg,#c89410,#a87808,#906800);border-radius:44% 44% 48% 48%;transform:rotate(-7deg);box-shadow:inset -2px -2px 5px rgba(0,0,0,.18);transform-origin:top right;animation:ew 2.5s ease-in-out infinite}
.d-ear.r{top:-5px;right:-3px;width:14px;height:16px;background:linear-gradient(155deg,#d8a818,#c89410,#a87808);border-radius:44% 48% 48% 48%;transform:rotate(7deg);box-shadow:inset -2px -2px 5px rgba(0,0,0,.18);animation:ewr 2.5s ease-in-out infinite .35s}
@keyframes ew{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-3deg)}}
@keyframes ewr{0%,100%{transform:rotate(7deg)}50%{transform:rotate(3deg)}}
.d-eye{position:absolute;width:11px;height:13px;background:radial-gradient(circle at 38% 33%,#281835,#180a28 55%,#0a0518);border-radius:50%;top:8px;overflow:hidden;box-shadow:inset 0 0 2px rgba(0,0,0,.5);z-index:2}
.d-eye.l{left:4px}.d-eye.r{left:26px}
.d-eye::before{content:'';position:absolute;top:1px;left:2px;width:6px;height:6px;background:radial-gradient(circle,#fff 55%,rgba(255,255,255,.75));border-radius:50%}
.d-eye::after{content:'';position:absolute;bottom:1px;right:2px;width:2.5px;height:2.5px;background:rgba(255,255,255,.65);border-radius:50%}
#gs:not(.sleeping) .d-eye{animation:bk 5s ease-in-out infinite}
@keyframes bk{0%,42%,44%,100%{transform:scaleY(1)}43%{transform:scaleY(.06)}}
.d-nose{position:absolute;bottom:8px;right:2px;width:8px;height:5.5px;background:radial-gradient(ellipse at 35% 28%,#3a2850,#1a0a28);border-radius:50%;box-shadow:0 0 2px rgba(0,0,0,.25);z-index:5}
.d-nose::after{content:'';position:absolute;top:.5px;left:2px;width:3px;height:1.5px;background:rgba(255,255,255,.3);border-radius:50%}
.d-mouth{position:absolute;bottom:3px;right:4px;width:8px;height:3.5px;border-bottom:1.8px solid rgba(110,70,15,.5);border-radius:0 0 50% 50%;z-index:5}
.d-mouth::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:4.5px;height:5px;background:linear-gradient(180deg,#ff7590,#e85565);border-radius:0 0 50% 50%;box-shadow:0 1px 2px rgba(228,80,100,.25);animation:tg .9s ease-in-out infinite alternate}
@keyframes tg{0%{transform:translateX(-50%) scaleY(1)}100%{transform:translateX(-50%) scaleY(1.15)}}
.d-chk{position:absolute;width:6px;height:3.5px;background:rgba(255,125,125,.28);border-radius:50%;top:18px;z-index:2}
.d-chk.l{left:0}.d-chk.r{left:38px}
.d-leg{position:absolute;bottom:-7px;width:9px;height:10px;background:linear-gradient(180deg,#d8a818,#c49410);border-radius:3px 3px 50% 50%;box-shadow:0 2px 2px rgba(0,0,0,.15);z-index:0}
.d-leg::after{content:'';position:absolute;bottom:0;left:-1px;width:11px;height:4px;background:#b08008;border-radius:50%}
.d-leg.fl{left:8px}.d-leg.fr{left:20px}.d-leg.bl{right:12px}.d-leg.br{right:3px}
.d-tail{position:absolute;top:-6px;right:1px;width:16px;height:9px;background:linear-gradient(90deg,#d8a818,#c49410,#a07800);border-radius:32px 36% 36% 32%;transform-origin:left center;animation:tailw .5s ease-in-out infinite alternate;box-shadow:0 1px 2px rgba(0,0,0,.15);z-index:0}
@keyframes tailw{0%{transform:rotate(-20deg) scale(1)}100%{transform:rotate(12deg) scale(1.05)}}
.d-tail::after{content:'';position:absolute;right:-1px;top:.5px;width:7px;height:6px;background:rgba(255,242,170,.45);border-radius:50%}
#gs.sleeping .d-eye{background:transparent!important;border-bottom:2.2px solid #281835;border-radius:0 0 50% 50%;width:11px;height:5px;top:10px;box-shadow:none;animation:none!important}
#gs.sleeping .d-eye::before,#gs.sleeping .d-eye::after,#gs.sleeping .d-mouth::after{display:none}
#gs.sleeping{animation:gsl 4s ease-in-out infinite}
@keyframes gsl{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
#gs.running{animation:run .22s steps(2) infinite}
@keyframes run{0%{transform:translateX(-40px) translateY(-2px) rotate(-2.5deg)}100%{transform:translateX(-42px) translateY(1px) rotate(2deg)}}
#gs.coding .d-ear.l{transform:rotate(-16deg)!important}
#gs.coding .d-ear.r{transform:rotate(10deg)!important}
#gs.coding .d-mouth::after{display:none}
#gs.thinking .d-eye{animation:lk 1.6s ease-in-out infinite!important}
@keyframes lk{0%,100%{top:7px}50%{top:3px}}
#aind{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:14px;pointer-events:none;animation:fl 2s ease-in-out infinite;opacity:.75}
@keyframes fl{0%,100%{transform:translateX(-50%) translateY(0);opacity:.5}50%{transform:translateX(-50%) translateY(-5px);opacity:1}}

/* ═══ JOURNAL (always visible) ═══ */
#jr{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ji{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.035);transition:background .15s}
.ji:hover{background:rgba(255,255,255,.015)}
.ji-t{font-size:8.5px;color:#444;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.ji-t b{color:#d4a017;font-weight:600}
.ji-x{font-size:11px;color:#b0b0b0;line-height:1.4}

/* ═══ STATS VIEW ═══ */
.sr3{display:flex;justify-content:space-between;padding:7px 14px;border-bottom:1px solid rgba(255,255,255,.035)}
.sr3 span:first-child{font-size:11px;color:#666}
.sr3 span:last-child{font-size:11px;color:#ddd;font-weight:600}

/* ═══ ACTIVITY VIEW ═══ */
.ai3{padding:7px 14px;border-bottom:1px solid rgba(255,255,255,.035);display:flex;align-items:center;gap:7px}
.ac3{font-size:13px;width:18px;text-align:center}
.at3{flex:1;font-size:11px;color:#aaa}
.am3{font-size:8.5px;color:#444}

/* ═══ CHAT OVERLAY ═══ */
#cp2{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;background:rgba(8,12,28,.97);z-index:60;height:0;overflow:hidden;transition:height .3s cubic-bezier(.4,0,.2,1)}
#cp2.open{height:68%}
.cp2-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.cp2-h h3{font-size:11px;font-weight:600;color:#fff}
.cp2-x{background:none;border:none;color:#555;font-size:13px;cursor:pointer;padding:2px 5px}
#cb2{flex:1;min-height:0;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.bb{max-width:85%;padding:6px 10px;border-radius:11px;font-size:11px;line-height:1.5}
.bb.bo{background:rgba(212,160,23,.07);border:1px solid rgba(212,160,23,.1);align-self:flex-start;border-bottom-left-radius:2px;color:#ccc}
.bb.bu{background:rgba(100,180,255,.07);border:1px solid rgba(100,180,255,.1);align-self:flex-end;border-bottom-right-radius:3px}
.ca2{display:flex;gap:5px;padding:7px 12px;border-top:1px solid rgba(255,255,255,.05)}
.ci2{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:7px 11px;color:#ddd;font-size:11px;outline:none}
.cs2{background:#d4a017;border:none;border-radius:50%;width:28px;height:28px;color:#050a1a;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ═══ LOGIN OVERLAY ═══ */
#lg{position:absolute;inset:0;background:rgba(5,10,20,.95);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lg.show{display:flex}
.lg-t{font-size:13px;color:#777;text-align:center;line-height:1.6}
.lg-t b{color:#d4a017}
.lg-a{background:linear-gradient(135deg,#24292e,#1b1f23);color:#fff;border:1px solid #30363d;border-radius:8px;padding:9px 20px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .2s;text-decoration:none}
.lg-a:hover{border-color:#d4a017;box-shadow:0 0 12px rgba(212,160,23,.15)}

/* ═══ NAVBAR ═══ */
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:none;color:#444;font-size:7px;cursor:pointer;padding:5px 4px;border-radius:5px;transition:all .15s;gap:1px;min-width:44px;text-decoration:none}
.nb .ic{font-size:16px;line-height:1}
.nb.act{color:#d4a017}
.nb:active{color:#fff}
.ns{width:1px;height:24px;background:rgba(255,255,255,.04);margin:0 1px}

/* ═══ LOADING ═══ */
#ld{position:fixed;inset:0;background:#040810;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
#ld.hide{opacity:0;transition:opacity .4s;pointer-events:none}
.ldp{width:28px;height:28px;border:2.5px solid rgba(212,160,23,.12);border-top-color:#d4a017;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><div class="ldp"></div><p style="margin-top:8px;font-size:9px;color:#d4a017">Loading...</p></div>

<!-- TOP: Playground -->
<div id="pg">
  <div class="st" style="top:8px;left:16px"></div>
  <div class="st" style="top:14px;left:120px;animation-delay:.6s"></div>
  <div class="st" style="top:5px;left:230px"></div>
  <div class="st" style="top:18px;left:330px;animation-delay:.4s"></div>
  <div class="st" style="top:10px;left:430px;animation-delay:.2s"></div>
  <div class="st" style="top:24px;left:55px"></div>
  <div class="st" style="top:3px;left:290px;animation-delay:.8s"></div>
  <div class="moon"></div>
  <div class="cld cc1"></div><div class="cld cc2"></div>
  <div id="tb"><span class="sb1" id="stg">Loading...</span><span class="sb2" id="sts">...</span></div>
  <div class="dh"><div class="dhn">🐕 Goldie</div><div class="dhr"></div><div class="dhb"><div class="dhd"></div></div></div>
  <div class="sl"><div class="s1"></div><div class="s2"></div><div class="s3"></div></div>
  <div class="grb"></div>
  <div class="gt2" style="left:8px"></div><div class="gt2" style="left:42px"></div><div class="gt2" style="left:90px"></div><div class="gt2" style="left:165px"></div><div class="gt2" style="left:260px"></div><div class="gt2" style="left:325px"></div><div class="gt2" style="left:390px"></div><div class="gt2" style="left:455px"></div>
  <div id="gc"><div id="gs" class="idle"><div id="aind">🐾</div><div class="dog">
    <div class="d-body"></div>
    <div class="d-leg fl"></div><div class="d-leg fr"></div><div class="d-leg bl"></div><div class="d-leg br"></div>
    <div class="d-tail"></div>
    <div class="d-head">
      <div class="d-ear l"></div><div class="d-ear r"></div>
      <div class="d-eye l"></div><div class="d-eye r"></div>
      <div class="d-chk l"></div><div class="d-chk r"></div>
      <div class="d-snout"></div><div class="d-nose"></div><div class="d-mouth"></div>
    </div>
  </div></div></div>
</div>

<!-- MIDDLE: Content -->
<div id="ct">
  <div id="jr"></div>
  <div id="cp2">
    <div class="cp2-h"><h3>💬 Chat with Goldie</h3><button class="cp2-x" id="cc">✕</button></div>
    <div id="cb2"></div>
    <div class="ca2"><input class="ci2" placeholder="Ask Goldie..." autocomplete="off"><button class="cs2" id="cssb">➤</button></div>
  </div>
  <div id="lg">
    <div class="lg-t">Chat requires<br><b>GitHub authentication</b></div>
    <a class="lg-a" id="lg-link">🐙 Login with GitHub</a>
  </div>
</div>

<!-- BOTTOM: Navbar -->
<nav id="nb">
  <button class="nb act" data-a="jr">📓 Journal</button>
  <button class="nb" data-a="chat">💬 Chat</button>
  <button class="nb" data-a="activity">📡 Activity</button>
  <button class="nb" data-a="stats">📊 Stats</button>
  <div class="ns"></div>
  <a class="nb" href="https://gitlawb.com" target="_blank">🌐 GLawb</a>
  <a class="nb" href="https://github.com" target="_blank">🐙 GitHub</a>
</nav>

<script>
(function(){
  var $=function(s){return document.querySelector(s)}, $$=function(s){return document.querySelectorAll(s)};
  var GH_CLIENT_ID='Ov23liLMEsHCQUzsfIKX';
  var GH_REDIRECT='https://gitpup.fun/auth/callback';
  var LD=$('#ld'),GS=$('#gs'),STG=$('#stg'),STS=$('#sts'),JR=$('#jr'),AIND=$('#aind');
  var CP=$('#cp2'),CB=$('#cb2'),CI2=$('#chati')||$('.ci2'),CS2=$('#cssb'),CC=$('#cc'),LG=$('#lg'),LG_LINK=$('#lg-link');
  var ghToken=localStorage.getItem('gp_gh_token');

  LG_LINK.onclick=function(){
    var url='https://github.com/login/oauth/authorize?client_id='+encodeURIComponent(GH_CLIENT_ID)+'&redirect_uri='+encodeURIComponent(GH_REDIRECT)+'&scope=read:user';
    window.location.href=url;
  };

  if(ghToken){CS2.disabled=false}else{CS2.disabled=true}

  function showView(id){
    $('.nb.act').classList.remove('act');
    $$('.nb').forEach(function(b){if(b.dataset.a===id)b.classList.add('act')});
    CP.classList.remove('open');LG.classList.remove('show');
    JR.style.display='';
  }

  function viewJournal(){JR.innerHTML='<p style="padding:14px;color:#555;font-size:11px">Loading journal...</p>';loadJournal()}
  function viewStats(){JR.innerHTML='<div class="sr3"><span>Stage</span><span id="vst">Loading...</span></div><div class="sr3"><span>Score</span><span id="vsc">...</span></div><div class="sr3"><span>State</span><span id="vsta">...</span></div>';loadStatus()}
  function viewActivity(){JR.innerHTML='<p style="padding:14px;color:#555;font-size:11px">Loading...</p>';loadActivity()}

  function loadJournal(){
    fetch('/api/journal').then(function(r){return r.json()}).then(function(d){
      if(d.entries&&d.entries.length>0){
        JR.innerHTML=d.entries.map(function(e){
          return '<div class="ji"><div class="ji-t"><b>'+(e.i||'✨')+'</b><span>'+(e.t||'')+'</span></div><div class="ji-x">'+(e.x||'')+'</div></div>';
        }).join('');
      }else{JR.innerHTML='<p style="padding:14px;color:#444;font-size:11px">No journal entries yet</p>'}
    }).catch(function(){JR.innerHTML='<p style="padding:14px;color:#444;font-size:11px">Failed to load</p>'});
  }

  function loadStatus(){
    fetch('/api/status').then(function(r){return r.json()}).then(function(d){
      STG.textContent=d.stage||'puppy';
      var el=$(' #vst');if(el)el.textContent=d.stage||'puppy';
      var el2=$('#vsc');if(el2)el2.textContent=''+(d.score||0);
      var el3=$('#vsta');if(el3)el3.textContent=d.llm?'LLM ON':'offline';
    }).catch(function(){});
  }

  function loadActivity(){
    fetch('/api/journal').then(function(r){return r.json()}).then(function(d){
      if(d.entries&&d.entries.length>0){
        JR.innerHTML=d.entries.slice(0,8).map(function(e){
          return '<div class="ai3"><span class="ac3">'+(e.i||'✨')+'</span><span class="at3">'+(e.x||'')+'</span><span class="am3">'+(e.t||'')+'</span></div>';
        }).join('');
      }
    }).catch(function(){});
  }

  function sendChat(){
    var m=CI2.value.trim();if(!m)return;
    var b=document.createElement('div');b.className='bb bu';b.textContent=m;CB.appendChild(b);CB.scrollTop=CB.scrollHeight;
    CI2.value='';
    var body={message:m,stage:STG.textContent||'puppy'};
    if(ghToken)body.token=ghToken;
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){
      var bb=document.createElement('div');bb.className='bb bo';bb.textContent=d.reply||'...';CB.appendChild(bb);CB.scrollTop=CB.scrollHeight;
    }).catch(function(e){var bb=document.createElement('div');bb.className='bb bo';bb.textContent='Error: '+e;CB.appendChild(bb);CB.scrollTop=CB.scrollHeight});
  }

  CS2.onclick=sendChat;
  CI2.onkeydown=function(e){if(e.key==='Enter')sendChat()};
  CC.onclick=function(){CP.classList.remove('open');showView('jr')};

  function openChat(){
    if(!ghToken){LG.classList.add('show');JR.style.display='none';return}
    LG.classList.remove('show');JR.style.display='none';
    CP.classList.add('open');
    setTimeout(function(){CI2&&CI2.focus()},200);
  }

  $$('.nb').forEach(function(b){
    b.onclick=function(e){
      var a=b.dataset.a;
      if(a==='chat'){openChat();return}
      CP.classList.remove('open');LG.classList.remove('show');
      if(a==='jr')viewJournal();
      else if(a==='activity')viewActivity();
      else if(a==='stats')viewStats();
    };
  });

  /* Status cycle */
  var ss=['idle','learning','coding','thinking','running'],si=0;
  setInterval(function(){si=(si+1)%ss.length;var c=ss[si];GS.className=c;AIND.textContent={'idle':'🐾','learning':'📚','coding':'⌨️','thinking':'💡','running':'🏃'}[c]||''},7000);

  /* Init */
  LD.classList.add('hide');
  setTimeout(function(){LD.style.display='none'},400);
  loadJournal();
  loadStatus();
})();
</script>
</body>
</html>
