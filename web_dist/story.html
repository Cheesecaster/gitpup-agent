<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Goldie's Story</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a1a;color:#ddd;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;min-height:100dvh;padding-bottom:24px;line-height:1.5}
.bb-bar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(5,10,20,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(212,160,23,.1);display:flex;align-items:center;padding:0 12px;z-index:100}
.bb-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#d4a017;font-size:14px;cursor:pointer;text-decoration:none;font-weight:600;padding:8px 4px}
.bb-title{margin-left:auto;font-size:11px;color:#555;letter-spacing:.5px}
.container{max-width:820px;margin:0 auto;padding:60px 10px 24px}
.page-head{text-align:center;margin:8px 0 18px}
h1{color:#d4a017;font-size:1.3rem;margin-bottom:2px}
.subtitle{color:#555;font-size:11px}
.section{background:rgba(8,14,32,.65);border:1px solid rgba(212,160,23,.1);border-radius:14px;padding:14px;margin-bottom:12px}
.section h2{font-size:13px;color:#d4a017;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section h2 .count{font-size:10px;color:#666;font-weight:400}
.chart-box{width:100%;max-width:300px;margin:0 auto}
canvas{display:block}
.entry{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.entry:last-child{border-bottom:none}
.entry-date{font-size:10px;color:#666;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.mood-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.entry-body{font-size:13px;color:#c8c8c8;line-height:1.6;word-break:break-word}
.rf-entry .entry-body{border-left:2px solid rgba(167,139,250,.3);padding-left:12px}
.msg{text-align:center;padding:20px;color:#555;font-size:12px}
.skel{display:flex;flex-direction:column;gap:10px;padding:8px 0}
.skel-line{height:14px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.03) 75%);background-size:200% 100%;animation:skelPulse 1.5s infinite}
.skel-line.w80{width:80%}.skel-line.w60{width:60%}.skel-line.w45{width:45%}.skel-line.w90{width:90%}
@keyframes skelPulse{from{background-position:200% 0}to{background-position:-200% 0}}
.fade-in{animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.mood-graph-wrap{width:100%;height:100px;margin-bottom:6px}
.mood-graph-wrap canvas{width:100%;height:100px;display:block;border-radius:8px}
</style>
</head>
<body>
<div class="bb-bar"><a class="bb-btn" href="/"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>Back</a><span class="bb-title">GOLDIE STORY</span></div>
<div class="container">
<div class="page-head"><h1>&#128054; Goldie's Story</h1><div class="subtitle">Day <span id="day-count">-</span></div></div>
<div class="section"><h2>&#129505; Personality Radar</h2><div class="chart-box"><canvas id="rc"></canvas></div></div>
<div class="section"><h2>&#128533; Mood Graph</h2><div class="mood-graph-wrap"><canvas id="moodGraph"></canvas></div><div id="moodList"></div></div>
<div class="section"><h2>&#129727; Self Reflection <span class="count" id="refCount"></span></h2><div class="skel" id="refSkel"><div class="skel-line w90"></div><div class="skel-line w80"></div><div class="skel-line w60"></div></div><div id="refList" style="display:none"></div></div>
<div class="section"><h2>&#128221; Journal <span class="count" id="jrnCount"></span></h2><div class="skel" id="jrnSkel"><div class="skel-line w80"></div><div class="skel-line w90"></div><div class="skel-line w60"></div></div><div id="jrnList" style="display:none"></div></div>
<div class="section"><h2>&#128165; Soul</h2><div class="skel" id="soulSkel"><div class="skel-line w90"></div><div class="skel-line w80"></div></div><div id="soulBox" style="display:none"></div></div>
</div>

<script id="chartJS">
if(typeof window.Chart==='undefined'){(function(){
var Chart=function(ctx,cfg){var data=cfg.data,opts=cfg.options,oR=opts.scales&&opts.scales.r||{},labels=data.labels||[],vals=data.datasets[0].data||[],n=labels.length,c=ctx.canvas,W=c.width,H=c.height,cx=W/2,cy=H/2,maxR=Math.min(W,H)*.42,maxV=oR.max||1.2;ctx.clearRect(0,0,W,H);for(var ring=1;ring<=4;ring++){var rr=maxR*(ring/4);ctx.beginPath();for(var i=0;i<=n;i++){var a=Math.PI*2*i/n-Math.PI/2,px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.stroke();}for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+maxR*Math.cos(a),cy+maxR*Math.sin(a));ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.stroke();}ctx.beginPath();for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,v=Math.min(vals[i]||0,maxV)/maxV;ctx.lineTo(cx+maxR*v*Math.cos(a),cy+maxR*v*Math.sin(a));}ctx.closePath();ctx.fillStyle=oR.fillColor||'rgba(212,160,23,.1)';ctx.fill();for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,v=Math.min(vals[i]||0,maxV)/maxV;ctx.beginPath();ctx.arc(cx+maxR*v*Math.cos(a),cy+maxR*v*Math.sin(a),3,0,Math.PI*2);ctx.fillStyle='#d4a017';ctx.fill();}ctx.fillStyle='#bbb';ctx.font='11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,ll=maxR+18,px=cx+ll*Math.cos(a),py=cy+ll*Math.sin(a);ctx.fillText(labels[i],px,py);}this.destroy=function(){};return this;};
window.Chart=Chart;})();}
</script>

<script>
function fmt(ts){if(!ts)return'';if(isNaN(new Date(ts).getTime()))return ts.substring(0,16);var d=new Date(ts),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return d.getDate().toString().padStart(2,'0')+' '+M[d.getMonth()]+' '+d.getFullYear()+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function esc(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML;}
function render(el,h){if(!el)return;el.innerHTML=h;el.classList.add('fade-in');}
function fetch1(url,cb,fn){var x=new XMLHttpRequest();x.open('GET',url);x.timeout=8000;x.onload=function(){try{cb(JSON.parse(x.responseText));}catch(e){if(fn)fn();}};x.ontimeout=fn;x.onerror=fn;x.send();}

// === RADAR ===
var rc=document.getElementById('rc');
if(rc){rc.width=600;rc.height=600;var rctx=rc.getContext('2d'),rMax=0.6;
fetch1('/api/personality',function(d){var de=document.getElementById('day-count');if(de)de.textContent=(d.stats&&d.stats.days_active)||1;var vals=d.data||[],lbls=d.labels||[],cols=d.colors||[],mx=0.3;for(var i=0;i<vals.length;i++)if(vals[i]>mx)mx=vals[i];rMax=mx*1.4||1;new Chart(rctx,{type:'radar',data:{labels:lbls,datasets:[{data:vals,borderColor:'#d4a017',backgroundColor:'rgba(212,160,23,.12)',pointBackgroundColor:cols,pointRadius:5,pointHoverRadius:7,borderWidth:2}]},options:{responsive:false,maintainAspectRatio:false,scales:{r:{beginAtZero:true,max:rMax,grid:{color:'rgba(255,255,255,.05)'},angleLines:{color:'rgba(255,255,255,.05)'},pointLabels:{color:'#bbb',font:{size:12,weight:'600'}},ticks:{display:false}}},plugins:{legend:{display:false}}}});},function(){rc.style.background='#111';});}

// === SELF REFLECTION - top 5 ===
fetch1('/api/reflections',function(d){var arr=d.entries||[],real=[];for(var i=0;i<arr.length;i++){if((arr[i].type==='reflection'||arr[i].type==='narrative')&&(arr[i].body||'').length>40)real.push(arr[i]);}real=real.slice(0,5);var cnt=document.getElementById('refCount');if(cnt)cnt.textContent='['+real.length+']';if(real.length===0){var sk=document.getElementById('refSkel');if(sk)sk.style.display='none';var b=document.getElementById('refList');if(b){b.innerHTML='<div class="msg">No reflections yet.</div>';b.style.display='';}return;}var h='';for(var i=0;i<real.length;i++){var e=real[i],mc=e.mood_color||'#a78bfa';h+='<div class="entry rf-entry"><div class="entry-date"><span class="mood-dot" style="background:'+mc+'"></span>'+(e.mood_label||e.mood||'')+' &middot; '+fmt(e.ts)+'</div><div class="entry-body">'+esc(e.body||'').substring(0,600)+'</div></div>';}var sk=document.getElementById('refSkel');if(sk)sk.style.display='none';var b=document.getElementById('refList');b.style.display='';render(b,h);},function(){var b=document.getElementById('refList');if(b){b.innerHTML='<div class="msg">Failed</div>';b.style.display='';}});

// === JOURNAL + MOOD - top 5 ===
fetch1('/api/journal',function(d){var arr=d.entries||[];
var mb=document.getElementById('moodList');if(mb){var ms=[];for(var i=0;i<arr.length;i++){if(arr[i].mood)ms.push(arr[i]);}ms=ms.slice(0,5);if(ms.length===0){mb.innerHTML='<div class="msg">No mood</div>';}else{drawMoodGraph(ms);var m='';for(var i=0;i<ms.length;i++){var e=ms[i];m+='<div class="entry" style="padding:8px 0"><span class="mood-dot" style="background:'+(e.mood_color||'#666')+'"></span><span style="font-size:12px;color:#bdbdbd">'+(e.mood_label||e.mood||'?')+'</span><span style="font-size:11px;color:#888"> &mdash; '+((e.x&&e.x.substring(0,20))||'')+'</span><div class="entry-date" style="color:#555;margin-top:2px;padding-left:14px">'+fmt(e.ts)+'</div></div>';}render(mb,m);}}
var jb=document.getElementById('jrnList'),jc=document.getElementById('jrnCount');if(jb){var jr=[];for(var i=0;i<arr.length;i++){if(!arr[i].body||arr[i].body.length<10)continue;jr.push(arr[i]);}jr=jr.slice(0,5);if(jc)jc.textContent='['+jr.length+']';if(jr.length===0)render(jb,'<div class="msg">No entries</div>');else{var j='';for(var i=0;i<jr.length;i++){var e=jr[i];j+='<div class="entry"><div class="entry-date"><span class="mood-dot" style="background:'+(e.mood_color||'#666')+'"></span>'+fmt(e.ts)+' &mdash; '+((e.x)||'')+'</div><div class="entry-body">'+esc((e.body||'').substring(0,400))+'</div></div>';}var sk=document.getElementById('jrnSkel');if(sk)sk.style.display='none';jb.style.display='';render(jb,j);}}
},function(){var b=document.getElementById('moodList');if(b)b.innerHTML='<div class="msg">Failed</div>';var j=document.getElementById('jrnList');if(j)j.innerHTML='<div class="msg">Failed</div>';});

// === SOUL ===
fetch1('/api/soul',function(d){var box=document.getElementById('soulBox'),sk=document.getElementById('soulSkel');if(box){if(sk)sk.style.display='none';box.style.display='';render(box,'<div style="white-space:pre-wrap;font-size:12px;color:#aaa;line-height:1.65">'+esc(d.content||'Empty')+'</div>');}},function(){var b=document.getElementById('soulBox');if(b){b.innerHTML='<div class="msg">Failed</div>';b.style.display='';}});

// === MOOD GRAPH ===
function drawMoodGraph(entries){var cvs=document.getElementById('moodGraph');if(!cvs||entries.length<2)return;var ctx=cvs.getContext('2d'),dpr=window.devicePixelRatio||1;cvs.width=800*dpr;cvs.height=100*dpr;cvs.style.width='100%';cvs.style.height='100px';ctx.scale(dpr,dpr);var W=800,H=100,pad=20;var pts=[];for(var i=entries.length-1;i>=0;i--){var dt=new Date(entries[i].ts);if(!isNaN(dt.getTime()))pts.push({t:dt.getTime(),color:entries[i].mood_color||'#666',label:entries[i].mood_label||''});}if(pts.length<2)return;var minT=pts[0].t,maxT=pts[pts.length-1].t,rng=maxT-minT||86400000;ctx.beginPath();ctx.lineWidth=2;for(var i=0;i<pts.length;i++){var x=pad+((pts[i].t-minT)/rng)*(W-2*pad),y=H/2;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.strokeStyle='rgba(212,160,23,0.3)';ctx.stroke();for(var i=0;i<pts.length;i++){var x=pad+((pts[i].t-minT)/rng)*(W-2*pad),y=H/2;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle=pts[i].color;ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#aaa';ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillText(pts[i].label,x,y+18);}}
</script>
</body>
</html>
