<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Goldie's Story</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a1a;color:#ddd;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;min-height:100dvh;padding-bottom:24px;line-height:1.5}
.bb-bar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(5,10,20,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(212,160,23,.1);display:flex;align-items:center;padding:0 12px;z-index:100}
.bb-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#d4a017;font-size:14px;cursor:pointer;text-decoration:none;font-weight:600;padding:8px 4px}
.bb-title{margin-left:auto;font-size:11px;color:#555;letter-spacing:.5px}
.container{max-width:820px;margin:0 auto;padding:60px 12px 24px}
.page-head{text-align:center;margin:8px 0 18px}
h1{color:#d4a017;font-size:1.3rem;margin-bottom:2px}
.subtitle{color:#555;font-size:11px}
.section{background:rgba(8,14,32,.65);border:1px solid rgba(212,160,23,.1);border-radius:14px;padding:14px;margin-bottom:12px}
.section h2{font-size:13px;color:#d4a017;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.section h2 .count{font-size:10px;color:#666;font-weight:400}

/* RADAR: centered with padding for labels */
.radar-wrap{display:flex;justify-content:center;padding:8px 0}
#rc{display:block;max-width:100%}

/* MOOD ARC: glowing timeline graph */
.mood-section{position:relative;overflow:hidden}
.mood-section:before{content:'';position:absolute;inset:-40% -10% auto auto;width:180px;height:180px;background:radial-gradient(circle,rgba(212,160,23,.14),transparent 68%);pointer-events:none}
.mood-wrap{width:100%;height:220px;position:relative;margin:2px 0 10px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(12,20,46,.82),rgba(4,8,18,.92));border:1px solid rgba(212,160,23,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 18px 50px rgba(0,0,0,.24)}
#moodGraph{width:100%;height:220px;display:block;border-radius:16px;position:relative;z-index:2}
.mood-glow{position:absolute;inset:0;background:radial-gradient(circle at 20% 18%,rgba(167,139,250,.16),transparent 30%),radial-gradient(circle at 80% 20%,rgba(34,211,238,.12),transparent 32%),linear-gradient(90deg,rgba(255,255,255,.03),transparent 35%,rgba(212,160,23,.04));z-index:1;pointer-events:none}
.mood-pills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.mood-pill{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);border-radius:12px;padding:9px 10px;min-width:0}
.mood-pill-top{display:flex;align-items:center;gap:7px;font-size:12px;color:#e7e7e7;font-weight:700}
.mood-pill-title{font-size:10px;color:#858b9b;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood-pill-date{font-size:9px;color:#5e6472;margin-top:2px}
@media(max-width:520px){.mood-pills{grid-template-columns:1fr}.mood-wrap{height:210px}#moodGraph{height:210px}}

/* SCROLL BOXES */
.scroll-box{max-height:200px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(212,160,23,.2) transparent}
.scroll-box::-webkit-scrollbar{width:4px}
.scroll-box::-webkit-scrollbar-track{background:transparent}
.scroll-box::-webkit-scrollbar-thumb{background:rgba(212,160,23,.2);border-radius:2px}
.entry{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.entry:last-child{border-bottom:none}
.entry-date{font-size:10px;color:#666;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.mood-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.entry-body{font-size:13px;color:#c8c8c8;line-height:1.6;word-break:break-word}
.rf-entry .entry-body{border-left:2px solid rgba(167,139,250,.3);padding-left:12px}
.msg{text-align:center;padding:20px;color:#555;font-size:12px}
.skel{display:flex;flex-direction:column;gap:10px;padding:8px 0}
.skel-line{height:14px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.03) 75%);background-size:200% 100%;animation:skelPulse 1.5s infinite}
.skel-line.w80{width:80%}.skel-line.w60{width:60%}.skel-line.w45{width:45%}.skel-line.w90{width:90%}
@keyframes skelPulse{from{background-position:200% 0}to{background-position:-200% 0}}
.fade-in{animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="bb-bar"><a class="bb-btn" href="/"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>Back</a><span class="bb-title">GOLDIE STORY</span></div>
<div class="container">
<div class="page-head"><h1>&#128054; Goldie's Story</h1><div class="subtitle">Day <span id="day-count">-</span></div></div>

<div class="section"><h2>&#129505; Personality Radar</h2><div class="radar-wrap"><canvas id="rc" width="600" height="600"></canvas></div></div>

<div class="section mood-section"><h2>&#127775; Mood Arc <span class="count" id="moodCount"></span></h2><div class="mood-wrap mood-arc-v2"><canvas id="moodGraph"></canvas><div class="mood-glow"></div></div><div id="moodList" class="mood-pills"></div></div>

<div class="section"><h2>&#129727; Self Reflections <span class="count" id="refCount"></span></h2><div class="skel" id="refSkel"><div class="skel-line w90"></div><div class="skel-line w80"></div><div class="skel-line w60"></div></div><div class="scroll-box" id="refList" style="display:none"></div></div>

<div class="section"><h2>&#128221; Journal <span class="count" id="jrnCount"></span></h2><div class="skel" id="jrnSkel"><div class="skel-line w80"></div><div class="skel-line w90"></div><div class="skel-line w60"></div></div><div class="scroll-box" id="jrnList" style="display:none"></div></div>

<div class="section"><h2>&#128165; Soul</h2><div class="skel" id="soulSkel"><div class="skel-line w90"></div><div class="skel-line w80"></div></div><div class="scroll-box" id="soulBox" style="display:none"></div></div>
</div>

<script id="chartJS">
if(typeof window.Chart==='undefined'){(function(){
var Chart=function(ctx,cfg){
var data=cfg.data,opts=cfg.options,oR=opts.scales&&opts.scales.r||{},labels=data.labels||[],vals=data.datasets[0].data||[],n=labels.length;
var c=ctx.canvas,W=c.width,H=c.height,cx=W/2,cy=H/2;
var maxR=Math.min(W,H)*0.35,maxV=oR.max||1.2;
ctx.clearRect(0,0,W,H);
for(var ring=1;ring<=4;ring++){var rr=maxR*(ring/4);ctx.beginPath();for(var i=0;i<=n;i++){var a=Math.PI*2*i/n-Math.PI/2,px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.stroke();}
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+maxR*Math.cos(a),cy+maxR*Math.sin(a));ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.stroke();}
ctx.beginPath();for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,v=Math.min(vals[i]||0,maxV)/maxV;ctx.lineTo(cx+maxR*v*Math.cos(a),cy+maxR*v*Math.sin(a));}
ctx.closePath();ctx.fillStyle=oR.fillColor||'rgba(212,160,23,.12)';ctx.fill();
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,v=Math.min(vals[i]||0,maxV)/maxV;ctx.beginPath();ctx.arc(cx+maxR*v*Math.cos(a),cy+maxR*v*Math.sin(a),3,0,Math.PI*2);ctx.fillStyle='#d4a017';ctx.fill();}
ctx.fillStyle='#ccc';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2;var ll=maxR+16;var px=cx+ll*Math.cos(a),py=cy+ll*Math.sin(a);ctx.fillText(labels[i],px,py);}
this.destroy=function(){};return this;};
window.Chart=Chart;})();}
</script>

<script>
function fmt(ts){if(!ts)return'';if(isNaN(new Date(ts).getTime()))return ts.substring(0,16);var d=new Date(ts),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return d.getDate().toString().padStart(2,'0')+' '+M[d.getMonth()]+' '+d.getFullYear()+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function esc(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML;}
function render(el,h){if(!el)return;el.innerHTML=h;el.classList.add('fade-in');}
function fetch1(url,cb,fn){var x=new XMLHttpRequest();x.open('GET',url);x.timeout=8000;x.onload=function(){try{cb(JSON.parse(x.responseText));}catch(e){if(fn)fn();}};x.ontimeout=fn;x.onerror=fn;x.send();}

/* === RADAR === */
var rc=document.getElementById('rc');
if(rc){var rctx=rc.getContext('2d'),rMax=0.6;rc.width=600;rc.height=600;
fetch1('/api/personality',function(d){
var de=document.getElementById('day-count');if(de)de.textContent=(d.stats&&d.stats.days_active)||1;
var vals=d.data||[],lbls=d.labels||[],cols=d.colors||[];
var mx=0.3;for(var i=0;i<vals.length;i++){if(vals[i]>mx)mx=vals[i];}
rMax=mx*1.4||1;
new Chart(rctx,{type:'radar',data:{labels:lbls,datasets:[{data:vals,borderColor:'#d4a017',backgroundColor:'rgba(212,160,23,.12)',pointBackgroundColor:cols,pointRadius:5,pointHoverRadius:7,borderWidth:2}]},options:{responsive:false,maintainAspectRatio:false,scales:{r:{beginAtZero:true,max:rMax,grid:{color:'rgba(255,255,255,.05)'},angleLines:{color:'rgba(255,255,255,.05)'},pointLabels:{color:'#ccc',font:{size:11,weight:'600'}},ticks:{display:false}}},plugins:{legend:{display:false}}}});
},function(){rc.style.background='#111';});}

/* === REFLECTIONS - latest first === */
function parseStoryTs(ts){var d=new Date(String(ts||'').replace(' ','T'));return isNaN(d.getTime())?0:d.getTime();}
function newestFirst(a,b){return parseStoryTs(b.ts)-parseStoryTs(a.ts);}
fetch1('/api/reflections',function(d){
  var arr=d.entries||[],real=[];
  for(var i=0;i<arr.length;i++){
    var e=arr[i]||{};
    var phase=e.event&&e.event.phase;
    if(((e.type==='reflection'||e.type==='narrative'||phase==='deep_self_reflection'||String(e.x||'').indexOf('Self-Reflection')>=0))&&(e.body||'').length>40)real.push(e);
  }
  real=real.sort(newestFirst).slice(0,8);
  var cnt=document.getElementById('refCount');if(cnt)cnt.textContent='['+real.length+' latest]';
  var sk=document.getElementById('refSkel');if(sk)sk.style.display='none';
  var b=document.getElementById('refList');b.style.display='';
  if(real.length===0){render(b,'<div class="msg">No reflections yet.</div>');return;}
  var h='';
  for(var i=0;i<real.length;i++){
    var e=real[i],mc=e.mood_color||'#a78bfa',lbl=e.mood_label||e.mood||'reflection';
    h+='<div class="entry rf-entry"><div class="entry-date"><span class="mood-dot" style="background:'+mc+';box-shadow:0 0 14px '+mc+'66"></span><b style="color:#c4b5fd">'+esc(lbl)+'</b> &middot; '+fmt(e.ts)+'</div><div class="entry-body">'+esc(e.body||'').substring(0,720)+'</div></div>';
  }
  render(b,h);
},function(){var b=document.getElementById('refList');if(b){b.innerHTML='<div class="msg">Failed</div>';b.style.display='';}});

/* === JOURNAL + MOOD === */
fetch1('/api/journal',function(d){var arr=d.entries||[];
var mb=document.getElementById('moodList'),mcnt=document.getElementById('moodCount');
if(mb){var ms=[];for(var i=0;i<arr.length;i++){if(arr[i].mood)ms.push(arr[i]);}ms=ms.sort(newestFirst).slice(0,8);
if(mcnt)mcnt.textContent='['+ms.length+' latest]';
if(ms.length===0){mb.innerHTML='<div class="msg">No mood</div>';}
else{drawMoodGraph(ms);
var m='';for(var i=0;i<Math.min(ms.length,6);i++){var e=ms[i];var lbl=e.mood_label||e.mood||'?';var col=e.mood_color||'#666';
m+='<div class="mood-pill"><div class="mood-pill-top"><span class="mood-dot" style="background:'+col+';box-shadow:0 0 14px '+col+'88"></span><span>'+esc(lbl)+'</span></div><div class="mood-pill-title">'+esc((e.x||'Goldie journal').substring(0,42))+'</div><div class="mood-pill-date">'+fmt(e.ts)+'</div></div>';}
render(mb,m);}}
var jb=document.getElementById('jrnList'),jc=document.getElementById('jrnCount');
if(jb){var jr=[];for(var i=0;i<arr.length;i++){if(!arr[i].body||arr[i].body.length<10)continue;jr.push(arr[i]);}jr=jr.sort(newestFirst).slice(0,5);if(jc)jc.textContent='['+jr.length+']';var sk=document.getElementById('jrnSkel');if(sk)sk.style.display='none';jb.style.display='';if(jr.length===0)render(jb,'<div class="msg">No entries</div>');else{var j='';for(var i=0;i<jr.length;i++){var e=jr[i];j+='<div class="entry"><div class="entry-date"><span class="mood-dot" style="background:'+(e.mood_color||'#666')+'"></span>'+fmt(e.ts)+' '+esc(e.x||'')+'</div><div class="entry-body">'+esc((e.body||'').substring(0,400))+'</div></div>';}render(jb,j);}}
},function(){var b=document.getElementById('moodList');if(b)b.innerHTML='<div class="msg">Failed</div>';var j=document.getElementById('jrnList');if(j)j.innerHTML='<div class="msg">Failed</div>';});

/* === SOUL === */
fetch1('/api/soul',function(d){var box=document.getElementById('soulBox'),sk=document.getElementById('soulSkel');if(box){if(sk)sk.style.display='none';box.style.display='';render(box,'<div style="white-space:pre-wrap;font-size:12px;color:#aaa;line-height:1.65">'+esc(d.content||'Empty')+'</div>');}},function(){var b=document.getElementById('soulBox');if(b){b.innerHTML='<div class="msg">Failed</div>';b.style.display='';}});

/* === MOOD ARC v2 - glowing curved timeline === */
function drawMoodGraph(entries){
var cvs=document.getElementById('moodGraph');if(!cvs||entries.length<1)return;
var ctx=cvs.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
var rect=cvs.parentNode.getBoundingClientRect();
var cW=Math.max(340,Math.floor(rect.width||800)),cH=Math.max(200,Math.floor(rect.height||220));
cvs.width=cW*dpr;cvs.height=cH*dpr;cvs.style.width='100%';cvs.style.height=cH+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cW,cH);
var padL=30,padR=26,padT=28,padB=46;
var newest=entries.slice().sort(function(a,b){return parseStoryTs(a.ts)-parseStoryTs(b.ts);});
var moodScore={excited:.92,proud:.86,curious:.76,determined:.72,awed:.68,amused:.64,contemplative:.54,nostalgic:.50,humbled:.46,skeptical:.38,wary:.32,confused:.24};
var pts=[];
for(var i=0;i<newest.length;i++){
  var e=newest[i],key=String(e.mood||e.mood_label||'contemplative').toLowerCase().split(/\s+/)[0];
  var score=(key in moodScore)?moodScore[key]:(.42+((i%5)*.09));
  var x=padL+(newest.length===1?.5:i/(newest.length-1))*(cW-padL-padR);
  var y=padT+(1-score)*(cH-padT-padB);
  pts.push({x:x,y:y,e:e,score:score,color:e.mood_color||'#d4a017',label:e.mood_label||e.mood||'mood'});
}
// background grid
ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.045)';
for(var g=0;g<4;g++){var gy=padT+g*(cH-padT-padB)/3;ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(cW-padR,gy);ctx.stroke();}
// soft area
var grad=ctx.createLinearGradient(0,padT,0,cH-padB);grad.addColorStop(0,'rgba(212,160,23,.26)');grad.addColorStop(.55,'rgba(167,139,250,.11)');grad.addColorStop(1,'rgba(34,211,238,0)');
ctx.beginPath();
ctx.moveTo(pts[0].x,cH-padB);
ctx.lineTo(pts[0].x,pts[0].y);
for(var i=0;i<pts.length-1;i++){var p=pts[i],n=pts[i+1],mx=(p.x+n.x)/2;ctx.bezierCurveTo(mx,p.y,mx,n.y,n.x,n.y);}
ctx.lineTo(pts[pts.length-1].x,cH-padB);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
// glow line
ctx.save();ctx.shadowColor='rgba(212,160,23,.55)';ctx.shadowBlur=14;ctx.lineWidth=5;ctx.strokeStyle='rgba(212,160,23,.18)';
ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(var i=0;i<pts.length-1;i++){var p=pts[i],n=pts[i+1],mx=(p.x+n.x)/2;ctx.bezierCurveTo(mx,p.y,mx,n.y,n.x,n.y);}ctx.stroke();ctx.restore();
// crisp line
var lineGrad=ctx.createLinearGradient(padL,0,cW-padR,0);lineGrad.addColorStop(0,'#22d3ee');lineGrad.addColorStop(.45,'#d4a017');lineGrad.addColorStop(1,'#a78bfa');
ctx.lineWidth=2.5;ctx.strokeStyle=lineGrad;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(var i=0;i<pts.length-1;i++){var p=pts[i],n=pts[i+1],mx=(p.x+n.x)/2;ctx.bezierCurveTo(mx,p.y,mx,n.y,n.x,n.y);}ctx.stroke();
// labels and dots
ctx.textAlign='center';ctx.textBaseline='middle';
for(var i=0;i<pts.length;i++){
  var p=pts[i];
  ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle='rgba(4,8,18,.9)';ctx.stroke();
  ctx.fillStyle='rgba(231,231,231,.95)';ctx.font='700 10px system-ui';ctx.fillText(String(p.label).substring(0,12),p.x,Math.max(14,p.y-18));
  ctx.fillStyle='rgba(150,157,174,.82)';ctx.font='9px system-ui';ctx.fillText(fmt(p.e.ts).substring(0,6),p.x,cH-24);
}
ctx.fillStyle='rgba(212,160,23,.78)';ctx.font='700 10px system-ui';ctx.textAlign='left';ctx.fillText('emotional trajectory',padL,16);
ctx.textAlign='right';ctx.fillStyle='rgba(150,157,174,.72)';ctx.fillText('latest '+entries.length+' moods',cW-padR,16);
}
</script>
</body>
</html>
