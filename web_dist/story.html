<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Goldie's Story</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a1a;color:#ddd;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;min-height:100dvh;padding-bottom:24px;line-height:1.5}
.bb-bar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(5,10,20,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(212,160,23,.1);display:flex;align-items:center;padding:0 12px;z-index:100}
.bb-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#d4a017;font-size:14px;cursor:pointer;text-decoration:none;font-weight:600;padding:8px 4px}
.bb-title{margin-left:auto;font-size:11px;color:#555;letter-spacing:.5px}
.container{max-width:820px;margin:0 auto;padding:60px 10px 24px}
.page-head{text-align:center;margin:8px 0 18px}
h1{color:#d4a017;font-size:1.3rem;margin-bottom:2px}
.subtitle{color:#555;font-size:11px}
.section{background:rgba(8,14,32,.65);border:1px solid rgba(212,160,23,.1);border-radius:14px;padding:14px;margin-bottom:12px}
.section h2{font-size:13px;color:#d4a017;margin-bottom:12px}
.chart-box{width:100%;max-width:300px;margin:0 auto}
canvas{width:300px;height:300px;display:block;margin:0 auto}
.entry{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.entry:last-child{border-bottom:none}
.entry-date{font-size:10px;color:#666;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.mood-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.entry-body{font-size:13.5px;color:#c8c8c8;line-height:1.65;word-break:break-word}
.rf-entry .entry-body{border-left:2px solid rgba(167,139,250,.3);padding-left:12px}
.msg{text-align:center;padding:20px;color:#555;font-size:12px}
#soul-content{font-size:12px;color:#aaa;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.repo-tag{display:inline-block;background:rgba(212,160,23,.1);color:#d4a017;font-size:9px;padding:2px 6px;border-radius:4px;margin-top:4px}
.cost-big{font-size:28px;font-weight:700;color:#d4a017;margin:4px 0}
.cost-sub{font-size:11px;color:#777;margin:2px 0}
.cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cost-cell{background:rgba(0,0,0,.3);border-radius:8px;padding:10px;text-align:center}
.cost-cell .val{font-size:16px;font-weight:600;color:#e0c050}
.cost-cell .lbl{font-size:9px;color:#666;margin-top:2px}
.cost-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.05);margin-top:4px;overflow:hidden}
.cost-bar-fill{height:100%;background:linear-gradient(90deg,#d4a017,#b8860b);border-radius:3px}
.phase-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:12px}
.phase-row:last-child{border-bottom:none}
.phase-name{flex:1;color:#aaa;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phase-n{color:#555;font-size:10px;width:30px;text-align:right}
.phase-c{color:#d4a017;font-size:11px;width:70px;text-align:right;font-weight:600}
</style>
</head>
<body>
<div class="bb-bar">
<a class="bb-btn" href="/">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>Back</a>
<span class="bb-title">GOLDIE STORY</span>
</div>
<div class="container">
<div class="page-head"><h1>&#128054; Goldie's Story</h1>
<div class="subtitle">Day <span id="day-count">1</span></div></div>

<div class="section"><h2>&#129505; Personality Radar</h2>
<div class="chart-box"><canvas id="rc"></canvas></div></div>

<div class="section"><h2>&#128533; Mood Timeline</h2>
<div id="moodList"><div class="msg">Loading...</div></div></div>

<div class="section"><h2>&#129727; Self Reflections</h2>
<div id="refList"><div class="msg">Loading...</div></div></div>

<div class="section"><h2>&#128218; Study Journal</h2>
<div id="jrnList"><div class="msg">Loading...</div></div></div>

<div class="section"><h2>&#128165; Soul</h2>
<div id="soulBox"><div class="msg">Loading...</div></div></div>

<div class="section"><h2>&#128176; LLM Cost</h2>
<div id="costBox"><div class="msg">Loading...</div></div></div>
</div>

<script id="chartJS">
if(typeof window.Chart==='undefined'){
(function(){
var Chart=function(ctx,cfg){
var data=cfg.data,opts=cfg.options,oR=opts.scales&&opts.scales.r||{},
labels=data.labels||[],vals=data.datasets[0].data||[],n=labels.length;
var c=ctx.canvas,W=c.width,H=c.height,cx=W/2,cy=H/2,
maxR=Math.min(W,H)*.42,maxV=oR.max||1.2;
ctx.clearRect(0,0,W,H);
for(var ring=1;ring<=4;ring++){var rr=maxR*(ring/4);
ctx.beginPath();
for(var i=0;i<=n;i++){var a=Math.PI*2*i/n-Math.PI/2;
var px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a);
i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.stroke();}
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+maxR*Math.cos(a),cy+maxR*Math.sin(a));
ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.stroke();}
ctx.beginPath();
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,
v=Math.min(vals[i]||0,maxV)/maxV;
ctx.lineTo(cx+maxR*v*Math.cos(a),cy+maxR*v*Math.sin(a));}
ctx.closePath();ctx.fillStyle=oR.fillColor||'rgba(212,160,23,.1)';ctx.fill();
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,
v=Math.min(vals[i]||0,maxV)/maxV;
ctx.beginPath();ctx.arc(cx+maxR*v*Math.cos(a),cy+maxR*v*Math.sin(a),3,0,Math.PI*2);
ctx.fillStyle='#d4a017';ctx.fill();}
ctx.fillStyle='#bbb';ctx.font='11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,
ll=maxR+18,px=cx+ll*Math.cos(a),py=cy+ll*Math.sin(a);ctx.fillText(labels[i],px,py);}
this.destroy=function(){};
return this;};
window.Chart=Chart;
})();
}
</script>

<script>
(function(){
function $(id){return document.getElementById(id);}
function fetchJSON(url,cb,fail){
try{var x=new XMLHttpRequest();x.open('GET',url);x.timeout=8000;
x.onload=function(){try{cb(JSON.parse(x.responseText));}catch(e){if(fail)fail();}};
x.ontimeout=function(){if(fail)fail();};
x.onerror=function(){if(fail)fail();};
x.send();}catch(e){if(fail)fail();}
}

var rc=$('rc');
if(!rc)return;
rc.width=600;rc.height=600;
var rctx=rc.getContext('2d');
var rMax=0.6;

fetchJSON('/api/personality',function(d){
var de=$('day-count');if(de)de.textContent=(d.stats&&d.stats.days_active)||1;
var vals=d.data||[],lbls=d.labels||[],cols=d.colors||[];
var mx=0.3;for(var i=0;i<vals.length;i++)if(vals[i]>mx)mx=vals[i];
rMax=mx*1.4||1;
new Chart(rctx,{type:'radar',
data:{labels:lbls,datasets:[{data:vals,borderColor:'#d4a017',
backgroundColor:'rgba(212,160,23,.12)',pointBackgroundColor:cols,
pointRadius:5,pointHoverRadius:7,borderWidth:2}]},
options:{responsive:false,maintainAspectRatio:false,
scales:{r:{beginAtZero:true,max:rMax,
grid:{color:'rgba(255,255,255,.05)'},
angleLines:{color:'rgba(255,255,255,.05)'},
pointLabels:{color:'#bbb',font:{size:12,weight:'600'}},
ticks:{display:false}}},
plugins:{legend:{display:false}}}});
},function(){$('rc').style.background='#111';});

// Self Reflections — ONLY entries from self-reflection (event.type === "reflect")
fetchJSON('/api/reflections',function(d){
var box=$('refList');if(!box)return;
var arr=d.entries||[];
var refs=[];
for(var i=0;i<arr.length;i++){
var e=arr[i];
var et=(e.event&&e.event.type)||'';
var isX=(e.x||'').toLowerCase().indexOf('self-reflection')>=0;
if(et==='reflect'||isX){refs.push(e);continue;}
if((e.body||'').length>80){
// Check if it's a reflection-style entry (4 numbered points, introspective)
var lines=(e.body||'').split(/\n/);
var has4Pattern=false;
for(var li=0;li<lines.length;li++){
if(/^\s*[\d]+[\.\)]\s*\*\*/.test(lines[li])||/^\s*[\d]+\.\s*\*\*/.test(lines[li])){has4Pattern=true;break;}
}
if(has4Pattern)refs.push(e);
}}
if(refs.length===0){box.innerHTML='<div class="msg">No reflections yet.</div>';return;}
var h='';for(var i=0;i<refs.length&&i<8;i++){var e=refs[i];
var mc=e.mood_color||'#a78bfa';
h+='<div class="entry rf-entry"><div class="entry-date"><span class="mood-dot" style="background:'+mc+'"></span>'+(e.mood_label||e.mood||'')+' &middot; '+((e.ts||'').substring(0,16))+'</div>';
h+='<div class="entry-body">'+esc(e.body||'').substring(0,800)+'</div></div>';}
box.innerHTML=h;
},function(){$('refList').innerHTML='<div class="msg">Failed to load</div>';});

// Mood Timeline — mood data from ALL entries
fetchJSON('/api/journal',function(d){
var box=$('moodList');if(!box)return;
var arr=d.entries||[];
var moods=[];for(var i=0;i<arr.length;i++){if(arr[i].mood)moods.push(arr[i]);}
moods=moods.slice(-20).reverse();
if(moods.length===0){box.innerHTML='<div class="msg">No mood data</div>';return;}
var h='';for(var i=0;i<moods.length;i++){var e=moods[i];
var isRef=(e.event&&e.event.type==='reflect')||((e.x||'').toLowerCase().indexOf('self-reflection')>=0);
var tag=isRef?'&#129727; Ref':'&#128218; '+((e.x||'').substring(0,25));
h+='<div class="entry" style="padding:8px 0"><span class="mood-dot" style="background:'+(e.mood_color||'#666')+'"></span> ';
h+='<span style="font-size:12px;color:#bdbdbd">'+(e.mood_label||e.mood||'?')+'</span> ';
h+='<span class="repo-tag">'+tag+'</span>';
h+='<div class="entry-date" style="color:#555;margin-top:2px;padding-left:14px">'+((e.ts||'').substring(0,16))+'</div></div>';}
box.innerHTML=h;
},function(){$('moodList').innerHTML='<div class="msg">Failed to load</div>';});

// Study Journal — ONLY entries from study sessions (NOT self-reflection)
fetchJSON('/api/journal',function(d){
var box=$('jrnList');if(!box)return;
var arr=d.entries||[];
var jrn=[];
for(var i=0;i<arr.length;i++){var e=arr[i];
var et=(e.event&&e.event.type)||'';
var isX=(e.x||'').toLowerCase().indexOf('self-reflection')>=0;
if(et==='reflect'||isX)continue; // Skip reflections
if(!e.body||e.body.length<10)continue;
jrn.push(e);}
if(jrn.length===0){box.innerHTML='<div class="msg">No study entries yet</div>';return;}
var h='';for(var i=0;i<jrn.length&&i<30;i++){var e=jrn[i];
var pass=e.event?('(Pass '+(e.event.study_pass||'?')+'):'):'(Study):';
h+='<div class="entry"><div class="entry-date"><span class="mood-dot" style="background:'+(e.mood_color||'#666')+'"></span>'+(e.ts||'').substring(0,16)+' &mdash; '+pass+' '+((e.x)||'')+'</div>';
h+='<div class="entry-body">'+esc((e.body||'').substring(0,400))+'</div></div>';}
box.innerHTML=h;
},function(){$('jrnList').innerHTML='<div class="msg">Failed to load</div>';});

fetchJSON('/api/soul',function(d){
var box=$('soulBox');if(box)box.textContent=d.content||'Empty';
},function(){if($('soulBox'))$('soulBox').textContent='Failed';});

// Cost card
fetchJSON('/api/cost',function(d){
  var b=$('costBox');if(!b)return;
  var tc=d.total_cost_usd||0, tt=d.total_tokens||0;
  var tcost=d.today_cost||0, ttok=d.today_tokens||0;
  var html='<div class="cost-big">$'+tc.toFixed(2)+'</div>';
  html+='<div class="cost-sub">Lifetime LLM spend</div>';
  html+='<div class="cost-grid">';
  html+='<div class="cost-cell"><div class="val">$'+tcost.toFixed(3)+'</div><div class="lbl">Today</div></div>';
  html+='<div class="cost-cell"><div class="val">'+(tt/1e6).toFixed(2)+'M</div><div class="lbl">Lifetime</div></div>';
  html+='<div class="cost-cell"><div class="val">'+(ttok/1e3).toFixed(0)+'K</div><div class="lbl">Today</div></div>';
  html+='<div class="cost-cell"><div class="val">'+(d.entries_count||0)+'</div><div class="lbl">Calls</div></div>';
  html+='</div>';
  // Phase breakdown
  var pp=d.per_phase||{};
  var keys=Object.keys(pp);
  if(keys.length>0){
    html+='<div style="margin-top:12px;font-size:10px;color:#555">BY PHASE</div>';
    var maxC=0;for(var k in pp)if(pp[k].cost_usd>maxC)maxC=pp[k].cost_usd;
    for(var k in pp){
      var v=pp[k], pct=maxC>0?(v.cost_usd/maxC*100):0;
      html+='<div class="phase-row">';
      html+='<span class="phase-name">'+k+'</span>';
      html+='<span class="phase-n">'+v.count+'x</span>';
      html+='<span class="phase-c">$'+v.cost_usd.toFixed(3)+'</span>';
      html+='</div>';
    }
  }
  b.innerHTML=html;
},function(){var b=$('costBox');if(b)b.innerHTML='<div class="msg">Cost unavailable</div>';});

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
})();
</script>
</body>
</html>
