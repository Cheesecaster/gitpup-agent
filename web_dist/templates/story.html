<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Goldie's Story</title>
<script>
var BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function formatDate(ts){if(!ts)return '';var parts=ts.split(' ');var d=parts[0].split('-');var y=parseInt(d[0]),m=parseInt(d[1])-1,day=parseInt(d[2]);var dow=new Date(y,m,day).getDay();return HARI[dow]+', '+day+' '+BULAN[m]+' '+y;}
window.INITIAL_RADAR={labels:["Explorer", "Scholar", "Builder", "Contributor", "Architect", "Dreamer"],data:[1.0, 1.0, 1.0, 0.0, 1.0, 1.0],colors:["#5cb88a", "#d4a24c", "#5eadb8", "#8b82b8", "#c9a24c", "#c95c5c"],stats:{"total_actions": 81, "days_active": 3}};</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a1a;color:#ddd;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;min-height:100dvh;padding-bottom:24px;line-height:1.5}
.bb-bar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(5,10,20,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(212,160,23,.1);display:flex;align-items:center;padding:0 12px;z-index:100}
.bb-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#d4a017;font-size:14px;cursor:pointer;text-decoration:none;font-weight:600;padding:8px 4px}
.bb-title{margin-left:auto;font-size:11px;color:#555;letter-spacing:.5px}
.container{max-width:820px;margin:0 auto;padding:60px 10px 24px}
.page-head{text-align:center;margin:8px 0 18px}
h1{color:#d4a017;font-size:1.3rem;margin-bottom:2px}
.subtitle{color:#555;font-size:11px}
.section{background:rgba(8,14,32,.65);border:1px solid rgba(212,160,23,.1);border-radius:14px;padding:14px;margin-bottom:12px}
.section h2{font-size:13px;color:#d4a017;margin-bottom:12px}
.chart-box{width:100%;max-width:300px;margin:0 auto}
canvas{width:300px;height:300px;display:block;margin:0 auto}
.entry{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.entry:last-child{border-bottom:none}
.entry-date{font-size:10px;color:#666;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.mood-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.entry-body{font-size:13.5px;color:#c8c8c8;line-height:1.65;word-break:break-word}
.rf-entry .entry-body{border-left:2px solid rgba(167,139,250,.3);padding-left:12px}
.msg{text-align:center;padding:20px;color:#555;font-size:12px}
#soul-content{font-size:12px;color:#aaa;line-height:1.65;white-space:pre-wrap;word-break:break-word}
/* Skeleton loading */
.skel{display:flex;flex-direction:column;gap:10px;padding:8px 0}
.skel-line{height:14px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.03) 75%);background-size:200% 100%;animation:skelPulse 1.5s infinite}
.skel-line.w80{width:80%}.skel-line.w60{width:60%}.skel-line.w45{width:45%}.skel-line.w90{width:90%}
@keyframes skelPulse{0%{background-position:200% 0}100%{background-position:-200% 0}}
.fade-in{animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="bb-bar">
<a class="bb-btn" href="/">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>Back</a>
<span class="bb-title">GOLDIE STORY</span>
</div>
<div class="container">
<div class="page-head"><h1>&#128054; Goldie's Story</h1>
<div class="subtitle">Day <span id="day-count">3</span></div></div>

<div class="section"><h2>&#129505; Personality Radar</h2>
<div class="chart-box"><canvas id="rc"></canvas></div></div>

<div class="section"><h2>&#128533; Mood Timeline</h2>
<div id="moodList"><div class="skel"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w90"></div><div class="skel-line w45"></div></div></div></div>

<div class="section"><h2>&#129727; Reflections</h2>
<div id="refList"><div class="skel"><div class="skel-line w90"></div><div class="skel-line w80"></div><div class="skel-line w60"></div></div></div></div>

<div class="section"><h2>&#128221; Journal</h2>
<div id="jrnList"><div class="skel"><div class="skel-line w80"></div><div class="skel-line w90"></div><div class="skel-line w60"></div><div class="skel-line w45"></div><div class="skel-line w80"></div></div></div></div>

<div class="section"><h2>&#128165; Soul</h2>
<div id="soulBox"><div class="skel"><div class="skel-line w90"></div><div class="skel-line w80"></div><div class="skel-line w60"></div></div></div></div>
</div>

<script id="chartJS">
if(typeof window.Chart==='undefined'){
(function(){
var Chart=function(ctx,cfg){
var data=cfg.data,opts=cfg.options,oR=opts.scales&&opts.scales.r||{},
labels=data.labels||[],vals=data.datasets[0].data||[],n=labels.length;
var c=ctx.canvas,W=c.width,H=c.height,cx=W/2,cy=H/2,
maxR=Math.min(W,H)*.42,maxV=oR.max||1.2;
ctx.clearRect(0,0,W,H);
for(var ring=1;ring<=4;ring++){var rr=maxR*(ring/4);
ctx.beginPath();
for(var i=0;i<=n;i++){var a=Math.PI*2*i/n-Math.PI/2;
var px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a);
i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.stroke();}
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+maxR*Math.cos(a),cy+maxR*Math.sin(a));
ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.stroke();}
ctx.beginPath();
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,
v=Math.min(vals[i]||0,maxV)/maxV;
ctx.lineTo(cx+maxR*v*Math.cos(a),cy+maxR*v*Math.sin(a));}
ctx.closePath();ctx.fillStyle=oR.fillColor||'rgba(212,160,23,.1)';ctx.fill();
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,
v=Math.min(vals[i]||0,maxV)/maxV;
ctx.beginPath();ctx.arc(cx+maxR*v*Math.cos(a),cy+maxR*v*Math.sin(a),3,0,Math.PI*2);
ctx.fillStyle='#d4a017';ctx.fill();}
ctx.fillStyle='#bbb';ctx.font='11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,
ll=maxR+18,px=cx+ll*Math.cos(a),py=cy+ll*Math.sin(a);ctx.fillText(labels[i],px,py);}
this.destroy=function(){};
return this;};
window.Chart=Chart;
})();
}
</script>

<script>
(function(){
function $(id){return document.getElementById(id);}
function fetchJSON(url,cb,fail){
var x=new XMLHttpRequest();x.open('GET',url);x.timeout=8000;
x.onload=function(){try{cb(JSON.parse(x.responseText));}catch(e){if(fail)fail();}};
x.ontimeout=function(){if(fail)fail();};
x.onerror=function(){if(fail)fail();};
x.send();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fadeSet(el,html){el.innerHTML=html;el.classList.add('fade-in');}

// === Radar ===
var rc=$('rc');
if(rc){
rc.width=600;rc.height=600;
var rctx=rc.getContext('2d');
var rMax=0.6;
// Render radar from inline data immediately
(function(){try{var id=window.INITIAL_RADAR;if(!id||!id.data)return;
rMax=Math.max.apply(null,id.data)*1.4||1;
new Chart(rctx,{type:'radar',data:{labels:id.labels,datasets:[{data:id.data,borderColor:'#d4a017',backgroundColor:'rgba(212,160,23,.12)',pointBackgroundColor:id.colors,pointRadius:5,pointHoverRadius:7,borderWidth:2}]},options:{responsive:false,maintainAspectRatio:false,scales:{r:{beginAtZero:true,max:rMax,grid:{color:'rgba(255,255,255,.05)'},angleLines:{color:'rgba(255,255,255,.05)'},pointLabels:{color:'#bbb',font:{size:12,weight:'600'}},ticks:{display:false}}},plugins:{legend:{display:false}}});
console.log('radar from inline');}catch(e){console.error(e);}})();
fetchJSON('/api/personality',function(d){
var de=$('day-count');if(de)de.textContent=(d.stats&&d.stats.days_active)||1;
var vals=d.data||[],lbls=d.labels||[],cols=d.colors||[];
var mx=0.3;for(var i=0;i<vals.length;i++)if(vals[i]>mx)mx=vals[i];
rMax=mx*1.4||1;
new Chart(rctx,{type:'radar',
data:{labels:lbls,datasets:[{data:vals,borderColor:'#d4a017',
backgroundColor:'rgba(212,160,23,.12)',pointBackgroundColor:cols,
pointRadius:5,pointHoverRadius:7,borderWidth:2}]},
options:{responsive:false,maintainAspectRatio:false,
scales:{r:{beginAtZero:true,max:rMax,
grid:{color:'rgba(255,255,255,.05)'},
angleLines:{color:'rgba(255,255,255,.05)'},
pointLabels:{color:'#bbb',font:{size:12,weight:'600'}},
ticks:{display:false}}},
plugins:{legend:{display:false}}}});
},function(){$('rc').style.background='#111';});
}

// === Reflections ===
fetchJSON('/api/reflections',function(d){
var box=$('refList');if(!box)return;
var arr=d.entries||[];
arr=arr.filter(function(e){return e.type==='reflection'||e.type==='narrative'});
var real=arr.filter(function(e){return(e.body||'').length>40});
if(real.length===0){fadeSet(box,'<div class="msg">No reflections yet.</div>');return;}
var h='';for(var i=0;i<real.length&&i<8;i++){var e=real[i];
var mc=e.mood_color||'#a78bfa';
h+='<div class="entry rf-entry"><div class="entry-date"><span class="mood-dot" style="background:'+mc+'"></span>'+(e.mood_label||e.mood||'')+' &middot; '+(formatDate(e.ts))+'</div>';
h+='<div class="entry-body">'+esc(e.body||'').substring(0,600)+'</div></div>';}
fadeSet(box,h);
},function(){fadeSet($('refList'),'<div class="msg">Failed to load</div>');});

// === Journal: fetch ONCE, use for both mood + journal ===
fetchJSON('/api/journal',function(d){
// MOOD
var moodBox=$('moodList');
if(moodBox){
var arr=d.entries||[];
var moods=[];for(var i=0;i<arr.length;i++){if(arr[i].mood)moods.push(arr[i]);}
moods=moods.slice(-20).reverse();
if(moods.length===0){fadeSet(moodBox,'<div class="msg">No mood data</div>');}
else{
var mh='';for(var i=0;i<moods.length;i++){var e=moods[i];
mh+='<div class="entry" style="padding:8px 0"><span class="mood-dot" style="background:'+(e.mood_color||'#666')+'"></span> ';
mh+='<span style="font-size:12px;color:#bdbdbd">'+(e.mood_label||e.mood||'?')+'</span> ';
mh+='<span style="font-size:11px;color:#888">&mdash; '+((e.x&&e.x.substring(0,20))||'')+'</span>';
mh+='<div class="entry-date" style="color:#555;margin-top:2px;padding-left:14px">'+(formatDate(e.ts))+'</div></div>';}
fadeSet(moodBox,mh);
}
}
// JOURNAL
var jrnBox=$('jrnList');
if(jrnBox){
var arr=d.entries||[];
var jrn=[];for(var i=0;i<arr.length;i++){
if(!arr[i].body||arr[i].body.length<10)continue;
if((arr[i].body||'').indexOf('self-reflection')>=0)continue;
if((arr[i].body||'').indexOf('I have learned')>=0)continue;
jrn.push(arr[i]);}
if(jrn.length===0){fadeSet(jrnBox,'<div class="msg">No entries yet</div>');}
else{
var jh='';for(var i=0;i<jrn.length&&i<30;i++){var e=jrn[i];
jh+='<div class="entry"><div class="entry-date"><span class="mood-dot" style="background:'+(e.mood_color||'#666')+'"></span>'+formatDate(e.ts)+' &mdash; '+((e.x)||'')+'</div>';
jh+='<div class="entry-body">'+esc((e.body||'').substring(0,400))+'</div></div>';}
fadeSet(jrnBox,jh);
}
}
},function(){
if($('moodList'))fadeSet($('moodList'),'<div class="msg">Failed to load</div>');
if($('jrnList'))fadeSet($('jrnList'),'<div class="msg">Failed to load</div>');
});

// === Soul ===
fetchJSON('/api/soul',function(d){
var box=$('soulBox');if(box)fadeSet(box,'<div style="white-space:pre-wrap;font-size:12px;color:#aaa;line-height:1.65">'+esc(d.content||'Empty')+'</div>');
},function(){if($('soulBox'))fadeSet($('soulBox'),'<div class="msg">Failed</div>');});

})();
</script>
</body>
</html>
