<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C857"/>
      <stop offset="100%" stop-color="#D4993A"/>
    </linearGradient>
    <linearGradient id="dark-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4993A"/>
      <stop offset="100%" stop-color="#B8802E"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB7B2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFB7B2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#1a1a2e"/>
  <!-- Background stars -->
  <circle cx="80" cy="80" r="3" fill="#FFD700" opacity="0.7"/>
  <circle cx="430" cy="100" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="100" cy="420" r="4" fill="#FF6B8A" opacity="0.4"/>
  <circle cx="420" cy="400" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="60" cy="260" r="2" fill="white" opacity="0.3"/>
  <circle cx="450" cy="240" r="2" fill="white" opacity="0.4"/>
  <!-- Body -->
  <ellipse cx="256" cy="380" rx="95" ry="65" fill="url(#fur)"/>
  <!-- Chest fluff -->
  <ellipse cx="256" cy="350" rx="55" ry="40" fill="#FDE8A0"/>
  <!-- Tail (wagging) -->
  <path d="M350 365 Q400 300 380 250" stroke="url(#fur)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <!-- Left ear -->
  <ellipse cx="180" cy="155" rx="38" ry="55" fill="url(#dark-fur)" transform="rotate(-15, 180, 155)"/>
  <!-- Right ear -->
  <ellipse cx="332" cy="155" rx="38" ry="55" fill="url(#dark-fur)" transform="rotate(15, 332, 155)"/>
  <!-- Head -->
  <ellipse cx="256" cy="210" rx="85" ry="80" fill="url(#fur)"/>
  <!-- Face fluff -->
  <ellipse cx="256" cy="235" rx="50" ry="35" fill="#FDE8A0"/>
  <!-- Left eye -->
  <ellipse cx="220" cy="195" rx="16" ry="18" fill="#2D1B69"/>
  <ellipse cx="224" cy="189" rx="7" ry="8" fill="white"/>
  <ellipse cx="218" cy="193" rx="3" ry="3" fill="white" opacity="0.5"/>
  <!-- Right eye -->
  <ellipse cx="292" cy="195" rx="16" ry="18" fill="#2D1B69"/>
  <ellipse cx="296" cy="189" rx="7" ry="8" fill="white"/>
  <ellipse cx="290" cy="193" rx="3" ry="3" fill="white" opacity="0.5"/>
  <!-- Eyebrows (happy) -->
  <path d="M204 175 Q220 168 236 175" stroke="#B8802E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M276 175 Q292 168 308 175" stroke="#B8802E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="256" cy="225" rx="12" ry="9" fill="#2D1B69"/>
  <ellipse cx="252" cy="222" rx="4" ry="3" fill="#4A3078" opacity="0.5"/>
  <!-- Mouth (big smile) -->
  <path d="M230 235 Q256 265 282 235" stroke="#2D1B69" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tongue -->
  <ellipse cx="262" cy="258" rx="10" ry="16" fill="#FF7E93"/>
  <path d="M258 248 L262 260 L266 248" stroke="#E06070" stroke-width="1" fill="none"/>
  <!-- Cheeks (blush) -->
  <circle cx="195" cy="220" r="22" fill="url(#cheek)"/>
  <circle cx="317" cy="220" r="22" fill="url(#cheek)"/>
  <!-- Collar -->
  <path d="M185 270 Q256 295 327 270" stroke="#FF7E93" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Collar tag -->
  <circle cx="256" cy="290" r="14" fill="#FFD700" stroke="#E5A030" stroke-width="2"/>
  <text x="256" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D1B69" font-family="sans-serif">GP</text>
  <!-- Front paws -->
  <ellipse cx="215" cy="420" rx="28" ry="20" fill="url(#fur)"/>
  <ellipse cx="297" cy="420" rx="28" ry="20" fill="url(#fur)"/>
  <!-- Paw lines -->
  <line x1="205" y1="418" x2="205" y2="428" stroke="#B8802E" stroke-width="2" stroke-linecap="round"/>
  <line x1="215" y1="415" x2="215" y2="428" stroke="#B8802E" stroke-width="2" stroke-linecap="round"/>
  <line x1="225" y1="418" x2="225" y2="428" stroke="#B8802E" stroke-width="2" stroke-linecap="round"/>
  <line x1="287" y1="418" x2="287" y2="428" stroke="#B8802E" stroke-width="2" stroke-linecap="round"/>
  <line x1="297" y1="415" x2="297" y2="428" stroke="#B8802E" stroke-width="2" stroke-linecap="round"/>
  <line x1="307" y1="418" x2="307" y2="428" stroke="#B8802E" stroke-width="2" stroke-linecap="round"/>
  <!-- Heart floating -->
  <g transform="translate(395, 150) scale(0.7)">
    <path d="M20 10 C20 0 5 -5 0 5 C-5 -5 -20 0 -20 10 C-20 25 0 35 0 35 C0 35 20 25 20 10Z" fill="#FF7E93"/>
  </g>
  <!-- Paw prints floating -->
  <g transform="translate(90, 130) scale(0.5)" opacity="0.5">
    <ellipse cx="0" cy="5" rx="6" ry="8" fill="#F5C542"/>
    <circle cx="-6" cy="-5" r="4" fill="#F5C542"/>
    <circle cx="6" cy="-5" r="4" fill="#F5C542"/>
    <circle cx="-10" cy="2" r="3.5" fill="#F5C542"/>
    <circle cx="10" cy="2" r="3.5" fill="#F5C542"/>
  </g>
  <g transform="translate(430, 280) scale(0.35)" opacity="0.4">
    <ellipse cx="0" cy="5" rx="6" ry="8" fill="#F5C542"/>
    <circle cx="-6" cy="-5" r="4" fill="#F5C542"/>
    <circle cx="6" cy="-5" r="4" fill="#F5C542"/>
    <circle cx="-10" cy="2" r="3.5" fill="#F5C542"/>
    <circle cx="10" cy="2" r="3.5" fill="#F5C542"/>
  </g>
</svg>
