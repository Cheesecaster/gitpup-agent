# Evo Garden Configuration
# Copy this to config.yaml and fill in the blanks

llm:
  provider: openrouter          # openai, anthropic, groq, openrouter, local
  model: google/gemini-2.0-flash-001
  api_key: ""                   # or set via env var LLM_API_KEY
  api_url: https://openrouter.ai/api/v1

project:
  goals_file: GOALS.md
  max_tokens_per_run: 8000
  max_cost_per_run: 2.00        # safety cap in USD
  test_command: "python -m pytest -x"

evolution:
  mode: vps                     # vps (always-on) or gitlawb-ci (cron)
  schedule: every_2h            # cron expression or preset: every_2h, every_4h, daily
  max_tasks_per_run: 3          # how many goals to attempt per cycle
  rollback_on_fail: true

web:
  host: 0.0.0.0
  port: 3000                    # dashboard
  sse_port: 8080                # live status stream

gitlawb:
  url: https://gitlawb.com       # or your self-hosted URL
  project: username/evo-garden  # group/project path
  default_branch: main
  author_name: "Evo Garden Agent"
  author_email: "agent@evo-garden.local"
  token: ""                     # GITLAWB_TOKEN env var
