stages:
  - test
  - build
  - evolve
  - deploy

variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  WEB_DIR: "$CI_PROJECT_DIR/web"

# Cache Python and Node dependencies
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - web/node_modules/

# ── Test: Run Python tests ──
test:agent:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install --cache-dir .cache/pip -q pyyaml pydantic httpx aiohttp pytest pytest-asyncio
    - python -m pytest tests/ -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Build: Build the website ──
build:web:
  stage: build
  image: node:20-alpine
  script:
    - cd web
    - npm ci
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Evolve: Run the agent evolution cycle ──
evolve:
  stage: evolve
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install --cache-dir .cache/pip -q -r requirements.txt 2>/dev/null || pip install --cache-dir .cache/pip -q pyyaml pydantic httpx aiohttp rich tree-sitter
    - chmod +x scripts/evolve.sh
    - ./scripts/evolve.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always

# ── Deploy: Push to VPS ──
deploy:vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "🌿 Deploying to VPS..."
    - rsync -avz --exclude 'node_modules' --exclude '__pycache__' --exclude '.git' --exclude '*.pyc' ./ "$VPS_USER@$VPS_HOST:/opt/evo-garden/"
    - ssh "$VPS_USER@$VPS_HOST" "cd /opt/evo-garden && systemctl restart evo-garden"
    - echo "✅ Deployed!"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
